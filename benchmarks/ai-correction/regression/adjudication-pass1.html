<style>
  :root {
    --paper: #f3f5f4;
    --card: #fdfdfc;
    --ink: #1e2a33;
    --muted: #5e6d74;
    --rule: #d6dcda;
    --rule-soft: #e6eae8;
    --mark: #a8690c;
    --mark-wash: rgba(201, 130, 30, 0.26);
    --bind: #2b6b8f;
    --bind-wash: rgba(43, 107, 143, 0.16);
    --direct: #2f7a5b;
    --notdirect: #a33b32;
    --ambiguous: #6a5f83;
    --shadow: rgba(30, 42, 51, 0.09);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #121a1f;
      --card: #1a242a;
      --ink: #e2e9e7;
      --muted: #92a3aa;
      --rule: #2c383f;
      --rule-soft: #232f36;
      --mark: #e0a44a;
      --mark-wash: rgba(224, 164, 74, 0.24);
      --bind: #6fb6db;
      --bind-wash: rgba(111, 182, 219, 0.18);
      --direct: #5cb98f;
      --notdirect: #e07d72;
      --ambiguous: #a99ac6;
      --shadow: rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --paper: #121a1f;
    --card: #1a242a;
    --ink: #e2e9e7;
    --muted: #92a3aa;
    --rule: #2c383f;
    --rule-soft: #232f36;
    --mark: #e0a44a;
    --mark-wash: rgba(224, 164, 74, 0.24);
    --bind: #6fb6db;
    --bind-wash: rgba(111, 182, 219, 0.18);
    --direct: #5cb98f;
    --notdirect: #e07d72;
    --ambiguous: #a99ac6;
    --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family:
      'IBM Plex Sans',
      system-ui,
      -apple-system,
      sans-serif;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    padding-bottom: 230px;
  }
  h1,
  h2,
  h3 {
    text-wrap: balance;
  }

  .rail {
    background: var(--card);
    border-bottom: 1px solid var(--rule);
    display: flex;
    gap: 1px;
    height: 26px;
    padding: 6px 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .rail button {
    background: var(--rule-soft);
    border: 0;
    border-radius: 1px;
    cursor: pointer;
    flex: 1;
    min-width: 2px;
    padding: 0;
    transition: transform 0.1s;
  }
  .rail button:hover {
    transform: scaleY(1.35);
  }
  .rail button[data-d='DIRECT'] {
    background: var(--direct);
  }
  .rail button[data-d='NOT_DIRECT'] {
    background: var(--notdirect);
  }
  .rail button[data-d='AMBIGUOUS'] {
    background: var(--ambiguous);
  }
  .rail button[data-incomplete='true'] {
    opacity: 0.45;
  }
  .rail button[data-current='true'] {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }

  header.bar {
    align-items: baseline;
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 12px 20px;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .grow {
    flex: 1;
  }

  main {
    display: grid;
    gap: 20px;
    grid-template-columns: minmax(320px, 5fr) minmax(340px, 6fr);
    margin: 0 auto;
    max-width: 1320px;
    padding: 20px;
  }
  @media (max-width: 940px) {
    main {
      grid-template-columns: 1fr;
    }
  }

  section.panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: 0 1px 2px var(--shadow);
    padding: 18px 20px;
  }
  section.panel + section.panel {
    margin-top: 20px;
  }

  .atom {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 21px;
    line-height: 1.35;
    margin: 6px 0 14px;
  }
  .sig {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    margin: 0 0 10px;
    word-break: break-word;
  }
  .sig .role {
    color: var(--bind);
  }
  .roles {
    border-top: 1px solid var(--rule-soft);
    margin-top: 12px;
    padding-top: 12px;
  }
  .role-row {
    align-items: baseline;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .role-row button {
    background: transparent;
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 3px 9px;
  }
  .role-row button[aria-pressed='true'] {
    background: var(--bind);
    border-color: var(--bind);
    color: #fff;
  }
  .role-row .bound {
    color: var(--bind);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .role-row .unbound {
    color: var(--notdirect);
    font-size: 12.5px;
  }
  .role-row .external {
    color: var(--muted);
    font-size: 12.5px;
  }

  .chip {
    background: var(--rule-soft);
    border-radius: 2px;
    color: var(--muted);
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 2px 7px;
  }
  blockquote.candidate {
    border-left: 3px solid var(--mark);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    line-height: 1.45;
    margin: 0;
    padding: 4px 0 4px 14px;
  }
  .response {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16.5px;
    line-height: 1.7;
    max-height: 44vh;
    overflow-y: auto;
  }
  .response .s {
    border-radius: 2px;
    cursor: pointer;
    padding: 1px 0;
  }
  .response .s:hover {
    background: var(--rule-soft);
  }
  .response .s.cand {
    background: var(--mark-wash);
    box-shadow: 0 1px 0 var(--mark);
  }
  .response .s.bound {
    background: var(--bind-wash);
    box-shadow: 0 1px 0 var(--bind);
  }
  .response .s.hidden {
    display: none;
  }
  .context {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin-top: 4px;
  }

  footer.dock {
    background: var(--card);
    border-top: 1px solid var(--rule);
    bottom: 0;
    box-shadow: 0 -2px 10px var(--shadow);
    left: 0;
    padding: 11px 20px 13px;
    position: fixed;
    right: 0;
    z-index: 15;
  }
  .dock-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin: 0 auto;
    max-width: 1320px;
  }
  .verdicts {
    display: flex;
    gap: 8px;
  }
  .verdicts button,
  .tri button,
  .ghost {
    background: transparent;
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    padding: 7px 13px;
  }
  .ghost {
    font-size: 13px;
    padding: 6px 11px;
  }
  kbd {
    background: var(--rule-soft);
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    margin-right: 7px;
    padding: 1px 5px;
  }
  .verdicts button[data-v='DIRECT'][aria-pressed='true'] {
    background: var(--direct);
    border-color: var(--direct);
    color: #fff;
  }
  .verdicts button[data-v='NOT_DIRECT'][aria-pressed='true'] {
    background: var(--notdirect);
    border-color: var(--notdirect);
    color: #fff;
  }
  .verdicts button[data-v='AMBIGUOUS'][aria-pressed='true'] {
    background: var(--ambiguous);
    border-color: var(--ambiguous);
    color: #fff;
  }
  .verdicts button[aria-pressed='true'] kbd {
    background: rgba(255, 255, 255, 0.22);
  }

  .tri {
    display: flex;
    gap: 6px;
  }
  .tri button {
    font-size: 13px;
    padding: 4px 10px;
  }
  .tri button[aria-pressed='true'] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--card);
  }
  .tri.proposed button[aria-pressed='true'] {
    background: transparent;
    border-style: dashed;
    color: var(--muted);
  }
  .ctl-label {
    font-size: 12.5px;
    margin-bottom: 3px;
  }
  .todo {
    color: var(--notdirect);
    font-size: 12.5px;
  }
  .todo.ok {
    color: var(--direct);
  }

  input[type='text'] {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    font: inherit;
    padding: 8px 10px;
    width: 100%;
  }
  :focus-visible {
    outline: 2px solid var(--mark);
    outline-offset: 2px;
  }
  textarea {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.45;
    min-height: 200px;
    padding: 10px;
    width: 100%;
  }
  .hash {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
  }
  ul.blockers {
    color: var(--notdirect);
    font-size: 13.5px;
    margin: 8px 0 0;
    padding-left: 20px;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<div class="rail" id="rail" role="navigation" aria-label="Progression"></div>

<header class="bar">
  <div>
    <div class="eyebrow">Passe 1 — aveugle</div>
    <strong>Adjudication des paires atome / passage</strong>
  </div>
  <div class="grow"></div>
  <div class="count" id="progress">—</div>
  <button class="ghost" id="who">relecteur…</button>
  <button class="ghost" id="toExport">export</button>
</header>

<main id="app"></main>

<footer class="dock" hidden id="dock">
  <div class="dock-inner">
    <div>
      <div class="eyebrow">Ce passage établit-il exactement l’atome&nbsp;?</div>
      <div class="verdicts" id="verdicts">
        <button data-v="DIRECT" aria-pressed="false"><kbd>D</kbd>direct</button>
        <button data-v="NOT_DIRECT" aria-pressed="false">
          <kbd>N</kbd>pas direct
        </button>
        <button data-v="AMBIGUOUS" aria-pressed="false">
          <kbd>A</kbd>ambigu
        </button>
      </div>
    </div>
    <div>
      <div class="ctl-label">
        <kbd>S</kbd> un autre passage soutient l’atome
      </div>
      <div class="tri" id="altTri"></div>
      <div class="ctl-label" style="margin-top: 6px">
        <kbd>V</kbd> vue de preuve complète
      </div>
      <div class="tri" id="viewTri"></div>
    </div>
    <div class="grow" style="min-width: 230px">
      <input
        id="why"
        type="text"
        placeholder="justification courte (obligatoire si ambigu)"
        autocomplete="off"
      />
      <div class="todo" id="todo" style="margin-top: 6px"></div>
    </div>
    <div style="align-self: center">
      <button class="ghost" id="prev">◀</button>
      <button class="ghost" id="next">▶</button>
    </div>
  </div>
</footer>

  "status": "PASSE 1 AVEUGLE — la clé de correspondance est dans un fichier séparé, non destiné au relecteur.",
  "supersedes": {

    "reason": "v1 gardait les membres d'une paire éloignés mais laissait la même réponse réapparaître à moins de huit cartes, en groupes de polarité pure ; la longueur séparait les membres à elle seule ; la signature rendait les rôles comme objets ; rien ne permettait de dire quel passage instancie quel témoin."

</script>
<script>
  const DECK = JSON.parse(document.getElementById('deck').textContent);
  const CARDS = DECK.cards;
  const STORE = 'adj-v3-' + DECK.manifestHash.slice(-12);
  /**
   * There is no proposed value.
   *
   * v2 kept both controls technically null but pre-selected « non » and « oui »
   * visually, and let one keystroke confirm both together. That anchors the
   * answer to « autre soutien = non » — a default in everything but storage.
   * Each control is now an independent, unprompted choice.
   */

  const state = { decisions: {}, index: 0, reviewer: '' };
  try {
    Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}'));
  } catch (error) {
    /* private window or blocked storage: start clean rather than fail */
  }
  let armedRole = null;

  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state));
    } catch (error) {
      /* the export panel is the durable path */
    }
  }

  function decisionFor(card) {
    if (!state.decisions[card.cardId]) {
      state.decisions[card.cardId] = {
        alternativeSupport: null,
        cardId: card.cardId,
        decidedAt: null,
        evidenceViewComplete: null,
        rationale: '',
        revealedBeforeVerdict: false,
        reviewerId: '',
        roleAssessments: {},
        verdict: null,
      };
    }
    return state.decisions[card.cardId];
  }

  const bindable = (card) => card.argumentRoles.filter((role) => role.bindable);

  function assessment(decision, roleId) {
    if (!decision.roleAssessments[roleId]) {
      decision.roleAssessments[roleId] = { sentenceIds: [], status: null };
    }
    return decision.roleAssessments[roleId];
  }

  /** How many sentences a BOUND role needs, from the atom's own cardinality. */
  function cardinalityMet(cardinality, count) {
    if (cardinality === '1') return count === 1;
    if (cardinality === '>=2') return count >= 2;
    if (cardinality === '>=0') return true;
    return count >= 1;
  }

  /** Everything that keeps a card from counting. Shown, never guessed at. */
  function blockers(card) {
    const decision = decisionFor(card);
    const list = [];
    if (!decision.verdict) list.push('verdict');
    if (decision.alternativeSupport === null)
      list.push('contrôle « autre soutien »');
    if (decision.evidenceViewComplete === null)
      list.push('contrôle « vue complète »');
    for (const role of bindable(card)) {
      const entry = assessment(decision, role.roleId);
      if (entry.status === null) {
        list.push('statut du témoin ' + role.roleId);
        continue;
      }
      if (
        entry.status === 'BOUND' &&
        !cardinalityMet(role.cardinality, entry.sentenceIds.length)
      ) {
        list.push(
          'témoin ' +
            role.roleId +
            ' : ' +
            role.cardinality +
            ' phrase(s) attendues',
        );
      }
      // A role can be genuinely absent — that is often WHY a card is not
      // direct. Requiring a binding there would manufacture a false witness.
      // The one place absence is compatible with DIRECT is a not_exists
      // quantifier, where absence is exactly what the atom asserts.
      if (
        decision.verdict === 'DIRECT' &&
        entry.status !== 'BOUND' &&
        card.quantifier !== 'not_exists'
      ) {
        list.push('un DIRECT exige le témoin ' + role.roleId + ' lié');
      }
      if (
        decision.verdict === 'DIRECT' &&
        card.quantifier === 'not_exists' &&
        entry.status === 'BOUND'
      ) {
        list.push('un DIRECT sur not_exists exige ' + role.roleId + ' absent');
      }
    }
    if (decision.verdict === 'AMBIGUOUS' && !decision.rationale)
      list.push('justification');
    return list;
  }

  const complete = (card) => blockers(card).length === 0;

  const escapeHtml = (value) =>
    value.replace(
      /[&<>]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c],
    );

  function renderSignature(card) {
    const args = card.argumentRoles
      .map(
        (role) => '<span class="role">' + escapeHtml(role.roleId) + '</span>',
      )
      .join(', ');
    return escapeHtml(card.predicate) + '(' + args + ')';
  }

  function renderResponse(card) {
    const decision = decisionFor(card);
    // Every role a sentence is bound to, not just the last one. One label per
    // sentence hid half of a reviewer's own choice on the very first card.
    const bound = new Map();
    for (const [roleId, entry] of Object.entries(decision.roleAssessments)) {
      for (const id of entry.sentenceIds || []) {
        bound.set(id, [...(bound.get(id) || []), roleId]);
      }
    }
    const revealed = decision.revealed === true || !card.window;
    let html = '';
    let cursor = 0;
    for (const sentence of card.sentences) {
      if (sentence.start > cursor) {
        html += escapeHtml(card.response.slice(cursor, sentence.start));
      }
      const inWindow =
        !card.window ||
        (sentence.start < card.window.end && sentence.end > card.window.start);
      const classes = ['s'];
      if (card.candidateSentenceIds.includes(sentence.id)) classes.push('cand');
      if (bound.has(sentence.id)) classes.push('bound');
      if (!inWindow && !revealed) classes.push('hidden');
      const label = bound.has(sentence.id)
        ? ' [' + escapeHtml(bound.get(sentence.id).join(' + ')) + ']'
        : '';
      html +=
        '<span class="' +
        classes.join(' ') +
        '" data-s="' +
        sentence.id +
        '">' +
        escapeHtml(card.response.slice(sentence.start, sentence.end)) +
        label +
        '</span>';
      cursor = sentence.end;
    }
    if (cursor < card.response.length)
      html += escapeHtml(card.response.slice(cursor));
    return html;
  }

  function renderRail() {
    const rail = document.getElementById('rail');
    rail.innerHTML = '';
    CARDS.forEach((card, index) => {
      const button = document.createElement('button');
      const decision = state.decisions[card.cardId];
      if (decision && decision.verdict) {
        button.dataset.d = decision.verdict;
        button.dataset.incomplete = String(!complete(card));
      }
      if (index === state.index) button.dataset.current = 'true';
      button.title = 'carte ' + (index + 1);
      button.setAttribute('aria-label', 'carte ' + (index + 1));
      button.onclick = () => {
        state.index = index;
        armedRole = null;
        render();
      };
      rail.appendChild(button);
    });
  }

  function tri(container, field) {
    const decision = decisionFor(CARDS[state.index]);
    const value = decision[field];
    container.className = 'tri';
    container.innerHTML = '';
    for (const option of ['yes', 'no']) {
      const button = document.createElement('button');
      button.textContent = option === 'yes' ? 'oui' : 'non';
      // Nothing is pressed while the answer is unset: no anchor, no proposal.
      button.setAttribute('aria-pressed', String(value === option));
      button.onclick = () => {
        decision[field] = option;
        touch();
      };
      container.appendChild(button);
    }
    if (value === null) {
      const tag = document.createElement('span');
      tag.className = 'chip';
      tag.textContent = 'sans réponse';
      container.appendChild(tag);
    }
  }

  function touch() {
    persist();
    render();
  }

  function render() {
    const card = CARDS[state.index];
    const decision = decisionFor(card);
    const roleRows = card.argumentRoles
      .map((role) => {
        if (!role.bindable) {
          return (
            '<div class="role-row"><button disabled>' +
            escapeHtml(role.roleId) +
            '</button><span class="external">' +
            escapeHtml(role.description) +
            ' — hors réponse</span></div>'
          );
        }
        const entry = assessment(decision, role.roleId);
        const labels = { ABSENT: 'absent', AMBIGUOUS: 'ambigu', BOUND: 'lié' };
        const states = ['BOUND', 'ABSENT', 'AMBIGUOUS']
          .map(
            (status) =>
              '<button class="status" data-status="' +
              status +
              '" data-for="' +
              escapeHtml(role.roleId) +
              '" aria-pressed="' +
              String(entry.status === status) +
              '">' +
              labels[status] +
              '</button>',
          )
          .join('');
        const bound =
          entry.status === 'BOUND'
            ? entry.sentenceIds.length
              ? '<span class="bound">' +
                entry.sentenceIds.join(', ') +
                '</span>'
              : '<span class="unbound">clique une phrase</span>'
            : '';
        return (
          '<div class="role-row"><button data-role="' +
          escapeHtml(role.roleId) +
          '" aria-pressed="' +
          String(armedRole === role.roleId) +
          '">' +
          escapeHtml(role.roleId) +
          '</button>' +
          states +
          bound +
          '<span class="external">' +
          escapeHtml(role.description) +
          ' · ' +
          escapeHtml(role.cardinality) +
          '</span></div>'
        );
      })
      .join('');

    document.getElementById('app').innerHTML = `
      <div>
        <section class="panel">
          <div class="eyebrow">Atome à établir</div>
          <p class="atom">${escapeHtml(card.atom)}</p>
          <p class="sig">${renderSignature(card)} · ${escapeHtml(card.quantifier)}${card.logicalOperator === 'none' ? '' : ' · ' + escapeHtml(card.logicalOperator)}</p>
          <div class="roles">
            <div class="eyebrow" style="margin-bottom:8px">Témoins</div>
            ${roleRows}
          </div>
          <p class="note" style="margin-bottom:0">Phrase du barème&nbsp;: «&nbsp;${escapeHtml(card.sourcePhrase)}&nbsp;» — critère ${escapeHtml(card.criterionLabel)}</p>
        </section>
        <section class="panel">
          <div class="eyebrow">Passage candidat</div>
          <blockquote class="candidate">${escapeHtml(card.candidateSpan)}</blockquote>
        </section>
        ${card.frame ? `<section class="panel"><div class="eyebrow">Consigne</div><p class="context">${escapeHtml(card.frame)}</p></section>` : ''}
        ${card.dossier ? `<section class="panel"><div class="eyebrow">Dossier</div><p class="context">${escapeHtml(card.dossier)}</p></section>` : ''}
      </div>
      <div>
        <section class="panel">
          <div class="eyebrow">
            ${card.window && decision.revealed !== true ? 'Extrait autour du passage' : 'Réponse complète'}
            <span class="chip">${escapeHtml(card.stratum)}</span>
            <span class="chip">${escapeHtml(card.cardId)}</span>
          </div>
          <div class="response" id="resp">${renderResponse(card)}</div>
          ${
            card.window && decision.revealed !== true
              ? '<p style="margin:12px 0 0"><button class="ghost" id="reveal">révéler la réponse complète</button> <span class="note">l’ouverture est journalisée</span></p>'
              : ''
          }
        </section>
      </div>`;

    for (const button of document.querySelectorAll('#verdicts button')) {
      button.setAttribute(
        'aria-pressed',
        String(button.dataset.v === decision.verdict),
      );
    }
    tri(document.getElementById('altTri'), 'alternativeSupport');
    tri(document.getElementById('viewTri'), 'evidenceViewComplete');
    document.getElementById('why').value = decision.rationale || '';
    const missing = blockers(card);
    const todo = document.getElementById('todo');
    todo.className = 'todo' + (missing.length ? '' : ' ok');
    todo.textContent = missing.length
      ? 'manque : ' + missing.join(', ')
      : 'carte complète';
    document.getElementById('dock').hidden = false;

    const done = CARDS.filter(
      (c) => state.decisions[c.cardId] && complete(c),
    ).length;
    document.getElementById('progress').textContent =
      `carte ${state.index + 1} / ${CARDS.length} · ${done} complètes`;
    document.getElementById('who').textContent = state.reviewer || 'relecteur…';

    for (const button of document.querySelectorAll('.role-row button.status')) {
      button.onclick = () => {
        const entry = assessment(decision, button.dataset.for);
        entry.status =
          entry.status === button.dataset.status ? null : button.dataset.status;
        if (entry.status !== 'BOUND') entry.sentenceIds = [];
        if (entry.status === 'BOUND') armedRole = button.dataset.for;
        touch();
      };
    }
    for (const button of document.querySelectorAll(
      '.role-row button[data-role]',
    )) {
      button.onclick = () => {
        armedRole =
          armedRole === button.dataset.role ? null : button.dataset.role;
        render();
      };
    }
    for (const sentence of document.querySelectorAll('#resp .s')) {
      sentence.onclick = () => {
        if (!armedRole) return;
        const entry = assessment(decision, armedRole);
        const id = sentence.dataset.s;
        entry.sentenceIds = entry.sentenceIds.includes(id)
          ? entry.sentenceIds.filter((x) => x !== id)
          : [...entry.sentenceIds, id];
        entry.status = entry.sentenceIds.length ? 'BOUND' : null;
        touch();
      };
    }
    const reveal = document.getElementById('reveal');
    if (reveal) {
      reveal.onclick = () => {
        decision.revealed = true;
        if (!decision.verdict) decision.revealedBeforeVerdict = true;
        touch();
      };
    }
    renderRail();
  }

  function record(verdict) {
    const card = CARDS[state.index];
    const decision = decisionFor(card);
    decision.verdict = verdict;
    decision.decidedAt = new Date().toISOString();
    decision.reviewerId = state.reviewer;
    persist();
    render();
    if (complete(card)) advance(1);
  }

  function advance(step) {
    state.index = Math.min(CARDS.length - 1, Math.max(0, state.index + step));
    armedRole = null;
    persist();
    render();
  }

  for (const button of document.querySelectorAll('#verdicts button')) {
    button.onclick = () => record(button.dataset.v);
  }
  document.getElementById('prev').onclick = () => advance(-1);
  document.getElementById('next').onclick = () => advance(1);
  document.getElementById('why').oninput = () => {
    decisionFor(CARDS[state.index]).rationale = document
      .getElementById('why')
      .value.trim();
    persist();
    const missing = blockers(CARDS[state.index]);
    const todo = document.getElementById('todo');
    todo.className = 'todo' + (missing.length ? '' : ' ok');
    todo.textContent = missing.length
      ? 'manque : ' + missing.join(', ')
      : 'carte complète';
  };
  document.getElementById('who').onclick = () => {
    const value = prompt(
      'Identifiant du relecteur (enregistré avec chaque décision)',
      state.reviewer,
    );
    if (value !== null) {
      state.reviewer = value.trim();
      touch();
    }
  };

  const cycle = (field) => {
    const decision = decisionFor(CARDS[state.index]);
    const order = [null, 'yes', 'no'];
    decision[field] =
      order[(order.indexOf(decision[field]) + 1) % order.length];
    touch();
  };

  addEventListener('keydown', (event) => {
    const target = event.target;
    if (target instanceof Element && target.matches('input, textarea')) {
      if (event.key === 'Escape' && target instanceof HTMLElement)
        target.blur();
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 'd') record('DIRECT');
    else if (key === 'n') record('NOT_DIRECT');
    else if (key === 'a') record('AMBIGUOUS');
    else if (key === 's') cycle('alternativeSupport');
    else if (key === 'v') cycle('evidenceViewComplete');
    else if (key === 'j') {
      event.preventDefault();
      document.getElementById('why').focus();
    } else if (event.key === 'ArrowLeft') advance(-1);
    else if (event.key === 'ArrowRight') advance(1);
  });

  /** Canonical JSON: sorted keys, compact separators — the repo's recipe. */
  function canonical(value) {
    if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
    if (value && typeof value === 'object') {
      return (
        '{' +
        Object.keys(value)
          .sort()
          .map((k) => JSON.stringify(k) + ':' + canonical(value[k]))
          .join(',') +
        '}'
      );
    }
    return JSON.stringify(value);
  }

  document.getElementById('toExport').onclick = async () => {
    const refusals = [];
    if (!state.reviewer) refusals.push('aucun identifiant de relecteur');
    const incomplete = CARDS.filter((card) => !complete(card));
    if (incomplete.length) {
      refusals.push(
        incomplete.length + ' cartes incomplètes sur ' + CARDS.length,
      );
    }
    document.getElementById('dock').hidden = true;

    if (refusals.length) {
      const detail = incomplete
        .slice(0, 12)
        .map(
          (card) =>
            '<li>' +
            escapeHtml(card.cardId) +
            ' — ' +
            escapeHtml(blockers(card).join(', ')) +
            '</li>',
        )
        .join('');
      document.getElementById('app').innerHTML = `
        <div style="grid-column: 1 / -1"><section class="panel">
          <div class="eyebrow">Export refusé</div>
          <p class="note">Une adjudication partielle exportée devient une adjudication citée.
             La passe 1 ne s’exporte que complète.</p>
          <ul class="blockers">${refusals.map((r) => '<li>' + escapeHtml(r) + '</li>').join('')}</ul>
          ${detail ? '<div class="eyebrow" style="margin-top:14px">Premières cartes en cause</div><ul class="blockers">' + detail + '</ul>' : ''}
          <p><button class="ghost" id="back">retour aux cartes</button></p>
        </section></div>`;
      document.getElementById('back').onclick = () => {
        document.getElementById('dock').hidden = false;
        render();
      };
      return;
    }

    const payload = {
      atomTaxonomyHash: DECK.atomTaxonomyHash,
      decisions: CARDS.map((card) => {
        const d = state.decisions[card.cardId];
        return {
          alternativeSupport: d.alternativeSupport,
          cardId: d.cardId,
          decidedAt: d.decidedAt,
          evidenceViewComplete: d.evidenceViewComplete,
          rationale: d.rationale,
          revealedBeforeVerdict: d.revealedBeforeVerdict === true,
          reviewerId: d.reviewerId || state.reviewer,
          roleAssessments: d.roleAssessments,
          verdict: d.verdict,
        };
      }).sort((a, b) => a.cardId.localeCompare(b.cardId)),
      deckHash: DECK.contentHash,
      deckSeed: DECK.shuffleSeed,
      manifestHash: DECK.manifestHash,
      pass: 1,
      schemaVersion: 3,
    };
    const text = canonical(payload);
    let digest = 'indisponible hors https';
    if (globalThis.crypto && crypto.subtle) {
      const bytes = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(text),
      );
      digest =
        'sha256:' +
        [...new Uint8Array(bytes)]
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
    }
    document.getElementById('app').innerHTML = `
      <div style="grid-column: 1 / -1"><section class="panel">
        <div class="eyebrow">Export de la passe 1</div>
        <p class="note">${payload.decisions.length} décisions complètes. Enregistre ce texte tel quel dans
          <code>benchmarks/ai-correction/regression/adjudication-pass1.v1.json</code>.
          Toute modification ultérieure produit une nouvelle version, jamais une réécriture.</p>
        <p class="hash"><strong>empreinte du texte ci-dessous&nbsp;:</strong> ${digest}</p>
        <p><button class="ghost" id="copy">copier</button>
           <button class="ghost" id="back">retour aux cartes</button></p>
        <textarea readonly id="out">${escapeHtml(text)}</textarea>
      </section></div>`;
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('copy').textContent = 'copié';
      } catch (error) {
        document.getElementById('out').select();
        document.getElementById('copy').textContent = 'sélectionné — ⌘C';
      }
    };
    document.getElementById('back').onclick = () => {
      document.getElementById('dock').hidden = false;
      render();
    };
  };

  render();
</script>
