status_definitions:
  active_instruction: current instructions for the named scope
  active_backlog: canonical backlog open according to ticket dependencies
  active_runtime_authority: current runtime identity or contract
  current_status: current observation without execution authority
  gated_backlog: canonical backlog whose implementation is conditionally closed
  exploratory: hypotheses only; no implementation authority
  navigation_only: routing aid; evidence and source documents prevail
  append_only_evidence: immutable historical evidence; new facts use a new version
  superseded_evidence: immutable predecessor retained only for provenance
  superseded_reference: preserved reference replaced as current routing authority

