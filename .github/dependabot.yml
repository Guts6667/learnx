# Dependency updates, grouped on purpose.
#
# Every pull request here runs Quality, Visual and Integration, and Integration
# creates a Neon branch against a project-wide ceiling of ten. Ungrouped weekly
# updates would open a dozen pull requests at once and starve the pipeline of
# the very capacity the feature work needs — the shape of the 29 August 2026
# outage, arrived at by a different road.
#
# So: minor and patch travel together in two pull requests, majors come alone
# because they need reading anyway, and at most three npm pull requests stay
# open at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope
