name: Fix and materialize SourceLab programs

on:
  push:
    branches:
      - agent/sourcelab-programs
    paths:
      - .github/workflows/fix-materialize-sourcelab-programs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct one-based resource positions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'scripts/sourcelab-programs/lib.mjs';
          const before = readFileSync(path, 'utf8');
          const from = 'const resources = lesson.resources.map(makeResource);';
          const to = 'const resources = lesson.resources.map((resource, index) => makeResource(resource, index + 1));';
          if (!before.includes(from) && !before.includes(to)) {
            throw new Error('Resource mapping anchor not found.');
          }
          writeFileSync(path, before.replace(from, to), 'utf8');
          NODE
      - name: Generate and validate SourceLab curricula
        run: |
          node scripts/generate-sourcelab-programs.mjs
          node scripts/generate-sourcelab-programs.mjs --check
      - name: Commit corrected and generated content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "SourceLab content is already valid and up to date."
            exit 0
          fi
          git commit -m "content(sourcelab): materialize validated LearnX programs [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
