name: Integration

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Create isolated Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          prisma: true
          project_id: ${{ vars.NEON_PROJECT_ID }}
      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
      - name: Apply migrations
        run: pnpm prisma:deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
      - name: Resolve seed owner on isolated clone
        shell: bash
        run: |
          admin_email="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT users.email
            FROM users
            INNER JOIN programs ON programs.owner_id = users.id
            WHERE programs.slug = 'fondamentaux-psychologie'
            ORDER BY programs.created_at
            LIMIT 1;
          ")"
          test -n "$admin_email"
          echo "::add-mask::$admin_email"
          echo "ADMIN_EMAIL=$admin_email" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
      - name: Validate targeted Platform APM seed twice
        shell: bash
        run: |
          pnpm prisma:seed
          first_signature="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v admin_email="$ADMIN_EMAIL" -Atc "$signature_query")"
          pnpm prisma:seed
          second_signature="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v admin_email="$ADMIN_EMAIL" -Atc "$signature_query")"
          test "$first_signature" = "$second_signature"
          test "$second_signature" = "1|2|5|6|19|12|6|6|30|2|0|0|0"
          echo "Platform APM targeted seed is idempotent: $second_signature"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          LEARNX_SEED_PROGRAM_SLUG: platform-apm-entretien-tryhackme
          signature_query: |
            WITH target_program AS (
              SELECT id FROM programs
              WHERE slug = 'platform-apm-entretien-tryhackme'
                AND owner_id = (SELECT id FROM users WHERE email = :'admin_email')
            ), target_stages AS (
              SELECT id, is_published FROM stages
              WHERE program_id IN (SELECT id FROM target_program)
            ), target_modules AS (
              SELECT id, is_published FROM modules
              WHERE stage_id IN (SELECT id FROM target_stages)
            ), target_lessons AS (
              SELECT id, is_published FROM lessons
              WHERE module_id IN (SELECT id FROM target_modules)
            ), target_concept_assessments AS (
              SELECT id FROM concept_assessments
              WHERE lesson_id IN (SELECT id FROM target_lessons)
            )
            SELECT concat_ws('|',
              (SELECT count(*) FROM target_program),
              (SELECT count(*) FROM target_stages),
              (SELECT count(*) FROM target_modules),
              (SELECT count(*) FROM target_lessons),
              (SELECT count(*) FROM content_blocks WHERE lesson_id IN (SELECT id FROM target_lessons)),
              (SELECT count(*) FROM resources WHERE lesson_id IN (SELECT id FROM target_lessons)),
              (SELECT count(*) FROM exercises WHERE lesson_id IN (SELECT id FROM target_lessons) AND is_canonical),
              (SELECT count(*) FROM target_concept_assessments),
              (SELECT count(*) FROM concept_assessment_questions WHERE assessment_id IN (SELECT id FROM target_concept_assessments)),
              (SELECT count(*) FROM stage_assessments WHERE stage_id IN (SELECT id FROM target_stages)),
              (SELECT count(*) FROM target_stages WHERE is_published),
              (SELECT count(*) FROM target_modules WHERE is_published),
              (SELECT count(*) FROM target_lessons WHERE is_published)
            );
      - name: Run real Functions and browser integration tests
        run: pnpm test:integration
        env:
          CI: 'true'
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          LEARNX_INTEGRATION_DATABASE: ephemeral
          LEARNX_INTEGRATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          SESSION_SECRET: integration-session-secret-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: integration-playwright-${{ github.run_id }}
          path: playwright-report-integration
      - name: Delete isolated Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
