name: Finalize landing redesign branch

on:
  push:
    branches: ['design/landing-your-path']
    paths:
      - '.github/workflows/visual-update-landing.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Sync dev and keep only scoped visual changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin dev
          git merge --no-ff --no-commit origin/dev
          git checkout origin/dev -- \
            tests/visual/__screenshots__/desktop-1440/surfaces.spec.ts/landing-pricing-tiers.png \
            tests/visual/__screenshots__/desktop-1440/surfaces.spec.ts/not-found.png \
            tests/visual/__screenshots__/tablet-768/surfaces.spec.ts/landing-pricing-tiers.png \
            tests/visual/__screenshots__/tablet-768/surfaces.spec.ts/not-found.png \
            tests/visual/__screenshots__/mobile-390/surfaces.spec.ts/landing-pricing-tiers.png \
            tests/visual/__screenshots__/mobile-390/surfaces.spec.ts/not-found.png
          git rm .github/workflows/visual-update-landing.yml
          git commit -m 'chore(landing): sync dev and keep scoped visual baselines'
          git push origin HEAD:design/landing-your-path
