name: Authenticated deployment check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check public shell and dedicated test account
        run: pnpm deployment:check -- "${{ vars.LEARNX_DEPLOYMENT_URL }}"
        env:
          DEPLOYMENT_CHECK_EMAIL: ${{ secrets.LEARNX_DEPLOYMENT_EMAIL }}
          DEPLOYMENT_CHECK_PASSWORD: ${{ secrets.LEARNX_DEPLOYMENT_PASSWORD }}
