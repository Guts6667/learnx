name: Authenticated deployment check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check public shell and dedicated test account
        run: pnpm deployment:check -- "${{ vars.LEARNX_DEPLOYMENT_URL }}"
        env:
          DEPLOYMENT_CHECK_EMAIL: ${{ secrets.LEARNX_DEPLOYMENT_EMAIL }}
          DEPLOYMENT_CHECK_PASSWORD: ${{ secrets.LEARNX_DEPLOYMENT_PASSWORD }}
