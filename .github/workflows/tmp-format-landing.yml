name: Temporary landing formatter

on:
  push:
    branches: [design/landing-path-redesign]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format landing files
        run: >-
          pnpm exec prettier --write
          src/components/landing/LandingPreviews.tsx
          src/styles/index.css
          src/styles/surfaces/landing-redesign.css
          src/styles/surfaces/landing-redesign-layout.css
      - name: Upload formatted landing files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-landing
          path: |
            src/components/landing/LandingPreviews.tsx
            src/styles/index.css
            src/styles/surfaces/landing-redesign.css
            src/styles/surfaces/landing-redesign-layout.css
          if-no-files-found: error
