name: Temporary landing formatter

on:
  push:
    branches: [design/landing-path-redesign]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore(landing): apply repository formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format landing files
        run: >-
          pnpm exec prettier --write
          src/components/landing/LandingPreviews.tsx
          src/styles/index.css
          src/styles/surfaces/landing-redesign.css
          src/styles/surfaces/landing-redesign-layout.css
      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/LandingPreviews.tsx src/styles/index.css src/styles/surfaces/landing-redesign.css src/styles/surfaces/landing-redesign-layout.css
          git commit -m "chore(landing): apply repository formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
