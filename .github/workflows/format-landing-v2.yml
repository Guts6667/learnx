name: Format landing prototype

on:
  push:
    branches:
      - design/landing-v2
    paths:
      - .github/workflows/format-landing-v2.yml
      - src/styles/surfaces/public-landing-v2.css

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the landing stylesheet
        run: pnpm exec prettier --write src/styles/surfaces/public-landing-v2.css

      - name: Commit the formatted stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/surfaces/public-landing-v2.css
          if ! git diff --cached --quiet; then
            git commit -m "chore(landing): format public styles"
            git push
          fi
