name: Visual

# Screenshots are platform-specific. The baselines a maintainer generates on
# macOS cannot be compared on a Linux runner, so the committed references are
# produced here and the comparison runs here too.
#
# Regenerating: run this workflow with `update` set to true, download the
# `visual-baselines` artifact, commit its contents over
# tests/visual/__screenshots__, and push. Do that only after reviewing why the
# pixels moved.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate the baselines instead of comparing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Visual baselines (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser used for baselines
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Compare against the committed baselines
        if: ${{ inputs.update != true }}
        run: pnpm test:visual
      - name: Regenerate the baselines
        if: ${{ inputs.update == true }}
        run: pnpm test:visual:update
      - name: Upload regenerated baselines
        if: ${{ inputs.update == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
          if-no-files-found: error
      - name: Upload the diff when a comparison fails
        if: ${{ failure() && inputs.update != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diff
          path: test-results
          if-no-files-found: ignore
