name: Isolate landing header and refresh dependent baselines

on:
  push:
    branches: ['design/landing-your-path']
    paths:
      - '.github/workflows/fix-landing-isolation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exclude minimal public headers from the landing treatment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/surfaces/landing-path.css')
          source = path.read_text()
          old = '.landing-page .landing-header {'
          new = '.landing-page .landing-header:not(.landing-header--minimal) {'
          if source.count(old) != 2:
              raise SystemExit(f'Expected two landing header selectors, found {source.count(old)}.')
          path.write_text(source.replace(old, new))
          PY
          pnpm exec prettier --write src/styles/surfaces/landing-path.css
      - name: Install the visual browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Regenerate visual baselines
        run: pnpm test:visual:update
      - name: Upload the isolated landing baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-landing-baselines
          path: tests/visual/__screenshots__
          if-no-files-found: error
      - name: Commit the scoped header and dependent pricing baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/styles/surfaces/landing-path.css \
            tests/visual/__screenshots__/desktop-1440/surfaces.spec.ts/landing-pricing-tiers.png \
            tests/visual/__screenshots__/tablet-768/surfaces.spec.ts/landing-pricing-tiers.png \
            tests/visual/__screenshots__/mobile-390/surfaces.spec.ts/landing-pricing-tiers.png
          git rm .github/workflows/fix-landing-isolation.yml
          git commit -m 'fix(landing): isolate the redesigned header treatment'
          git push origin HEAD:design/landing-your-path
