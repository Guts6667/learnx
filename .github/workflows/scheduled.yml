name: Scheduled operations

# What runs on its own, so a failure is noticed by a machine rather than by a
# person eventually looking.
#
# Three incidents on 29 and 30 August 2026 were each found by a human: a public
# form that had never worked, found by reading code; a preview environment that
# could reach no database, found by a payment pass; a production schema that had
# been dropped, found by whoever dropped it. None of them raised anything.
#
# IMPORTANT, and easy to lose a week to: GitHub registers `schedule` and
# `workflow_dispatch` only from the repository's DEFAULT branch. This file does
# nothing at all until it reaches `main`. It will not appear in the Actions list
# and cannot be dispatched before then. That is not a bug in the cron
# expression, and the same trap already swallowed the Neon sweep once.

on:
  schedule:
    # Smoke, four times a day. Often enough that an outage is measured in hours
    # rather than in days, rare enough to stay far below any usage limit.
    - cron: '13 */6 * * *'
    # Daily operations, early morning UTC, after the smoke of 05:13.
    - cron: '41 5 * * *'
  deployment_status:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [smoke, daily, cleanup-dry-run]
        default: smoke

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Read-only, and the only job that needs no database credential. It runs on
  # every production deployment as well as on the clock, because the question
  # "did that deploy actually work" is the one nobody remembers to ask.
  smoke:
    name: Production smoke
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cheap, public, and answers before any credential is involved: if this
      # fails there is no point authenticating to learn more.
      - name: API and database liveness
        env:
          DEPLOYMENT_URL: ${{ vars.LEARNX_DEPLOYMENT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "vars.LEARNX_DEPLOYMENT_URL is not set." >&2
            exit 1
          fi
          body="$(curl -sS -f --max-time 20 "${DEPLOYMENT_URL%/}/api/health")"
          echo "$body"
          echo "$body" | jq -e '.status == "ok" and .database == "ok"' > /dev/null

      - name: Authenticated deployment check
        run: pnpm deployment:check -- "${{ vars.LEARNX_DEPLOYMENT_URL }}"
        env:
          DEPLOYMENT_CHECK_EMAIL: ${{ secrets.LEARNX_DEPLOYMENT_EMAIL }}
          DEPLOYMENT_CHECK_PASSWORD: ${{ secrets.LEARNX_DEPLOYMENT_PASSWORD }}

  # Everything below needs a production database credential in CI, which does
  # not exist today and whose creation is an owner decision: it widens the blast
  # radius the day after a mis-targeted database command emptied production.
  #
  # So these jobs are closed by default and skip cleanly. Setting the variable
  # without the secret, or the reverse, keeps them closed rather than half
  # running — the same fail-closed rule the application applies to its flags.
  daily:
    name: Daily operations
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm the job is enabled and configured
        id: gate
        env:
          ENABLED: ${{ vars.LEARNX_SCHEDULED_DB_JOBS }}
          DATABASE_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          if [ "${ENABLED:-false}" != 'true' ] || [ -z "${DATABASE_URL:-}" ]; then
            echo "Skipped: set the variable LEARNX_SCHEDULED_DB_JOBS to true and"
            echo "the secret LEARNX_PRODUCTION_DATABASE_URL to enable these jobs."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'
      - run: pnpm prisma:generate
        if: steps.gate.outputs.run == 'true'

      # Reports and alerts, never writes. Exits non-zero when it has something
      # to report and no channel to report it through, which is exactly the
      # silence this workflow exists to break.
      - name: AI cost audit
        if: steps.gate.outputs.run == 'true'
        run: pnpm ai:cost-audit
        env:
          DATABASE_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}

      # Writes. Idempotent per cycle, so a daily run costs nothing after the
      # first success of a month and picks up accounts activated mid-cycle.
      - name: Trial allocation cycle
        if: steps.gate.outputs.run == 'true'
        run: pnpm trial:grant-cycle
        env:
          DATABASE_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}

      # Deliberately a dry run on a schedule. Deleting on a timer is how a
      # retention policy nobody re-reads quietly removes more than it was meant
      # to; `--apply` stays a deliberate act, below.
      - name: Retention cleanup, dry run
        if: steps.gate.outputs.run == 'true'
        run: pnpm maintenance:cleanup | tee retention-dry-run.txt
        env:
          DATABASE_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.LEARNX_PRODUCTION_DATABASE_URL }}

      - name: Upload the retention report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: retention-dry-run-${{ github.run_id }}
          path: retention-dry-run.txt
