name: Quality

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-quality:
    name: V4.1 final (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The R1 freeze test verifies bytes against its pinned code commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate i18n catalogs
        run: pnpm i18n:check
      - name: Formatting
        run: pnpm format:check
      - name: Install the critical browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Lint
        run: pnpm lint
      - name: Final imports, runtime, and cycle gate
        run: pnpm quality:imports:v4.1
      - name: Final 80 percent global coverage gate
        run: pnpm test:coverage:v4.1
        env:
          NODE_OPTIONS: --no-experimental-webstorage
      - name: Final 90 percent critical-domain coverage gate
        run: pnpm quality:coverage:critical
      - name: Dead files, exports, and dependencies
        run: pnpm quality:dead-code
      - name: Dead CSS
        run: pnpm quality:dead-css
      - name: Build
        run: pnpm build
      # Ran a single spec until 31 August 2026. The other nine files under
      # tests/e2e ran nowhere at all: the Integration config points at
      # tests/integration and the visual one at tests/visual, so nothing
      # selected them. They cover the landing page, the credit purchase, the
      # admin surfaces and the AI correction — the surfaces that broke twice
      # this week — and they were green the whole time, unread.
      #
      # They need no database: the API is mocked through tests/e2e/journey-api.
      # That is why they belong here rather than in Integration, whose Neon
      # branches are the scarce resource. 105 tests, under a minute.
      #
      # mobile-webkit is left out because this job installs chromium only;
      # adding it means downloading a second browser on every run, which is a
      # separate decision with its own cost.
      - name: End-to-end suite
        run: pnpm test:e2e:ci
      - name: Bundle budgets
        run: pnpm quality:bundle
      - name: High and critical production dependency audit
        run: pnpm quality:security
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: coverage-v4-1-final-${{ github.run_id }}
          path: coverage/coverage-summary.json
