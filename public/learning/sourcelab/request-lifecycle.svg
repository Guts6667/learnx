<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="request-title request-desc">
  <title id="request-title">Cycle d’une requête HTTP dans le starter SourceLab</title>
  <desc id="request-desc">Une commande curl envoie GET health live au processus Node démarré par server.ts. L’application Hono déclarée dans app.ts exécute le middleware de request ID, choisit le handler et renvoie une réponse 200. Si aucune route ne correspond, Hono renvoie 404.</desc>
  <defs>
    <marker id="request-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#466b82"/>
    </marker>
    <style>
      .title{font:700 26px system-ui,sans-serif;fill:#121c24}.eyebrow{font:700 12px ui-monospace,monospace;letter-spacing:1.4px;fill:#3f6176}.label{font:700 17px system-ui,sans-serif;fill:#121c24}.body{font:14px system-ui,sans-serif;fill:#58676d}.code{font:13px ui-monospace,monospace;fill:#121c24}.card{fill:#fffdf8;stroke:#60747e;stroke-width:2}.accent{fill:#d9e4e8;stroke:#466b82;stroke-width:2}.line{fill:none;stroke:#466b82;stroke-width:3;marker-end:url(#request-arrow)}.muted{fill:none;stroke:#944f49;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#request-arrow)}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="#f1eee6"/>
  <text x="48" y="48" class="eyebrow">L1 · ÉTAT CIBLE APRÈS LA MICRO-ACTION</text>
  <text x="48" y="82" class="title">Qui fait quoi entre curl et la réponse ?</text>

  <rect x="48" y="140" width="150" height="132" rx="16" class="card"/>
  <text x="68" y="174" class="label">Client</text>
  <text x="68" y="205" class="code">curl -i</text>
  <text x="68" y="228" class="code">GET /health/live</text>
  <text x="68" y="253" class="body">Crée la requête</text>

  <rect x="238" y="120" width="180" height="172" rx="16" class="card"/>
  <text x="258" y="154" class="label">Processus Node</text>
  <text x="258" y="184" class="code">server.ts</text>
  <text x="258" y="210" class="body">lit PORT puis ouvre</text>
  <text x="258" y="232" class="body">le port 3000</text>
  <rect x="258" y="248" width="140" height="28" rx="8" fill="#f1eee6"/>
  <text x="271" y="267" class="code">serve({ fetch })</text>

  <rect x="458" y="104" width="284" height="204" rx="18" class="accent"/>
  <text x="480" y="139" class="label">Application Hono · app.ts</text>
  <rect x="480" y="160" width="112" height="64" rx="10" class="card"/>
  <text x="494" y="185" class="code">middleware</text>
  <text x="494" y="208" class="body">request ID</text>
  <rect x="610" y="160" width="108" height="64" rx="10" class="card"/>
  <text x="624" y="185" class="code">handler</text>
  <text x="624" y="208" class="body">health/live</text>
  <path d="M592 192H606" class="line"/>
  <text x="480" y="257" class="body">Hono associe méthode + chemin.</text>
  <text x="480" y="281" class="code">c.json({ status: "ok" }, 200)</text>

  <rect x="786" y="140" width="126" height="132" rx="16" class="card"/>
  <text x="806" y="174" class="label">Réponse</text>
  <text x="806" y="205" class="code">HTTP 200</text>
  <text x="806" y="228" class="code">x-request-id</text>
  <text x="806" y="253" class="body">Retour au client</text>

  <path d="M198 206H232" class="line"/>
  <path d="M418 206H452" class="line"/>
  <path d="M742 206H780" class="line"/>

  <rect x="48" y="352" width="546" height="142" rx="16" fill="#fffdf8" stroke="#c8cdca" stroke-width="2"/>
  <text x="70" y="384" class="eyebrow">TRACE CORRÉLÉE</text>
  <text x="70" y="416" class="code">requête  x-request-id: 7c6f…fb96</text>
  <text x="70" y="442" class="code">log       requestId=7c6f…fb96 status=200</text>
  <text x="70" y="468" class="code">réponse   x-request-id: 7c6f…fb96</text>
  <text x="386" y="406" class="body">UUID abrégé : même ID</text>
  <text x="386" y="428" class="body">dans requête, log et réponse ;</text>
  <text x="386" y="450" class="body">il ne diagnostique rien</text>
  <text x="386" y="472" class="body">tout seul.</text>

  <rect x="634" y="352" width="278" height="160" rx="16" fill="#fff8f6" stroke="#944f49" stroke-width="2"/>
  <text x="656" y="384" class="eyebrow" style="fill:#944f49">AUCUNE ROUTE NE CORRESPOND</text>
  <text x="656" y="419" class="code">POST /health/live</text>
  <path d="M670 438H844" class="muted"/>
  <text x="656" y="474" class="label" style="fill:#944f49">404 dans la baseline</text>
  <text x="656" y="500" class="body">405 exige un comportement ajouté.</text>
</svg>
