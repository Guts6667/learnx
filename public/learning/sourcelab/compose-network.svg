<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="compose-title compose-desc">
  <title id="compose-title">Topologie Compose entre l’hôte, l’API, la migration et PostgreSQL</title>
  <desc id="compose-desc">Depuis la machine hôte, curl joint le service api sur localhost port 3000 publié. Dans le réseau Compose, api et le service ponctuel migrate joignent PostgreSQL par le nom de service db et le port 5432. Le service db doit être sain avant migrate, puis migrate doit terminer avec le code zéro avant le démarrage de api. Le volume postgres-data conserve les données. Localhost dans api désigne api, pas db.</desc>
  <defs>
    <marker id="compose-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466b82"/></marker>
    <marker id="compose-order-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7f683e"/></marker>
    <marker id="compose-bad-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#944f49"/></marker>
    <style>
      .title{font:700 26px system-ui,sans-serif;fill:#121c24}.eyebrow{font:700 12px ui-monospace,monospace;letter-spacing:1.4px;fill:#3f6176}.label{font:700 17px system-ui,sans-serif;fill:#121c24}.body{font:14px system-ui,sans-serif;fill:#58676d}.code{font:13px ui-monospace,monospace;fill:#121c24}.card{fill:#fffdf8;stroke:#60747e;stroke-width:2}.network{fill:#e9eef0;stroke:#466b82;stroke-width:2;stroke-dasharray:8 6}.healthy{fill:#d9e4e8;stroke:#466b82;stroke-width:2}.order{fill:#fff8f0;stroke:#7f683e;stroke-width:2}.bad{fill:#fff8f6;stroke:#944f49;stroke-width:2}.line{fill:none;stroke:#466b82;stroke-width:3;marker-end:url(#compose-arrow)}.orderLine{fill:none;stroke:#7f683e;stroke-width:3;marker-end:url(#compose-order-arrow)}.badLine{fill:none;stroke:#944f49;stroke-width:3;stroke-dasharray:7 6;marker-end:url(#compose-bad-arrow)}
    </style>
  </defs>
  <rect width="960" height="700" rx="24" fill="#f1eee6"/>
  <text x="48" y="46" class="eyebrow">L4 · RÉSEAU, SANTÉ ET PERSISTANCE</text>
  <text x="48" y="80" class="title">« localhost » dépend toujours du point de vue</text>

  <rect x="42" y="150" width="190" height="116" rx="16" class="card"/>
  <text x="64" y="184" class="label">Machine hôte</text>
  <text x="64" y="216" class="code">curl localhost:3000</text>
  <text x="64" y="242" class="body">port de api publié</text>

  <rect x="278" y="108" width="634" height="410" rx="24" class="network"/>
  <text x="302" y="140" class="eyebrow">RÉSEAU COMPOSE · NOMS DNS = NOMS DE SERVICE</text>

  <rect x="312" y="174" width="214" height="168" rx="18" class="card"/>
  <text x="334" y="210" class="label">service api</text>
  <text x="334" y="240" class="code">PORT=3000</text>
  <text x="334" y="270" class="body">liveness : processus</text>
  <text x="334" y="294" class="body">readiness : base joignable</text>
  <text x="334" y="322" class="code">DATABASE_URL → db:5432</text>

  <rect x="312" y="382" width="214" height="106" rx="16" class="order"/>
  <text x="334" y="416" class="label">service migrate</text>
  <text x="334" y="446" class="code">prisma migrate deploy</text>
  <text x="334" y="470" class="body">tâche ponctuelle · exit 0</text>

  <rect x="650" y="174" width="226" height="190" rx="18" class="healthy"/>
  <text x="672" y="210" class="label">service db</text>
  <text x="672" y="240" class="code">PostgreSQL :5432</text>
  <text x="672" y="272" class="body">healthcheck pg_isready</text>
  <text x="672" y="298" class="body">nom DNS interne : db</text>
  <text x="672" y="336" class="code">état attendu : healthy</text>

  <rect x="650" y="402" width="226" height="86" rx="16" class="card"/>
  <text x="672" y="434" class="label">Volume nommé</text>
  <text x="672" y="462" class="code">postgres-data:/var/lib/…</text>
  <text x="672" y="482" class="body">cycle de vie distinct</text>

  <path d="M232 208H306" class="line"/>
  <text x="244" y="194" class="code">:3000</text>
  <path d="M526 258H644" class="line"/>
  <text x="550" y="244" class="code">db:5432</text>
  <path d="M526 435C586 435 590 322 644 322" class="line"/>
  <text x="546" y="408" class="code">db:5432</text>
  <path d="M763 364V396" class="line"/>

  <rect x="42" y="350" width="190" height="138" rx="16" class="bad"/>
  <text x="64" y="384" class="label" style="fill:#944f49">Adresse erronée</text>
  <text x="64" y="416" class="code">api → localhost:5432</text>
  <text x="64" y="446" class="body">revient vers api,</text>
  <text x="64" y="468" class="body">jamais vers PostgreSQL</text>
  <path d="M312 300C268 300 270 418 238 418" class="badLine"/>

  <rect x="278" y="552" width="634" height="106" rx="18" class="order"/>
  <text x="302" y="582" class="eyebrow" style="fill:#7f683e">ORDRE DE DÉMARRAGE PROUVÉ</text>
  <text x="312" y="626" class="code">db healthy</text>
  <text x="528" y="626" class="code">migrate exit 0</text>
  <text x="772" y="626" class="code">api démarre</text>
  <path d="M406 620H512" class="orderLine"/>
  <path d="M658 620H756" class="orderLine"/>
  <text x="48" y="684" class="body">Le réseau transporte les connexions ; depends_on conditionne l’ordre ; le volume porte les données.</text>
</svg>
