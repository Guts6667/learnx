<title>Adjudication aveugle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
/>
<style>
  :root {
    --paper: #f3f5f4;
    --card: #fdfdfc;
    --ink: #1e2a33;
    --muted: #5e6d74;
    --rule: #d6dcda;
    --rule-soft: #e6eae8;
    --mark: #a8690c;
    --mark-wash: rgba(201, 130, 30, 0.26);
    --bind: #2b6b8f;
    --bind-wash: rgba(43, 107, 143, 0.16);
    --direct: #2f7a5b;
    --notdirect: #a33b32;
    --ambiguous: #6a5f83;
    --shadow: rgba(30, 42, 51, 0.09);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #121a1f;
      --card: #1a242a;
      --ink: #e2e9e7;
      --muted: #92a3aa;
      --rule: #2c383f;
      --rule-soft: #232f36;
      --mark: #e0a44a;
      --mark-wash: rgba(224, 164, 74, 0.24);
      --bind: #6fb6db;
      --bind-wash: rgba(111, 182, 219, 0.18);
      --direct: #5cb98f;
      --notdirect: #e07d72;
      --ambiguous: #a99ac6;
      --shadow: rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --paper: #121a1f;
    --card: #1a242a;
    --ink: #e2e9e7;
    --muted: #92a3aa;
    --rule: #2c383f;
    --rule-soft: #232f36;
    --mark: #e0a44a;
    --mark-wash: rgba(224, 164, 74, 0.24);
    --bind: #6fb6db;
    --bind-wash: rgba(111, 182, 219, 0.18);
    --direct: #5cb98f;
    --notdirect: #e07d72;
    --ambiguous: #a99ac6;
    --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    padding-bottom: 230px;
  }
  .rail {
    background: var(--card);
    border-bottom: 1px solid var(--rule);
    display: flex;
    gap: 1px;
    height: 26px;
    padding: 6px 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .rail button {
    background: var(--rule-soft);
    border: 0;
    border-radius: 1px;
    cursor: pointer;
    flex: 1;
    min-width: 2px;
    padding: 0;
  }
  .rail button[data-d='DIRECT'] {
    background: var(--direct);
  }
  .rail button[data-d='NOT_DIRECT'] {
    background: var(--notdirect);
  }
  .rail button[data-d='AMBIGUOUS'] {
    background: var(--ambiguous);
  }
  .rail button[data-g='ok'] {
    background: var(--direct);
  }
  .rail button[data-g='ko'] {
    background: var(--notdirect);
  }
  .rail button[data-incomplete='true'] {
    opacity: 0.45;
  }
  .rail button[data-current='true'] {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }
  header.bar {
    align-items: baseline;
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 12px 20px;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .grow {
    flex: 1;
  }
  main {
    display: grid;
    gap: 20px;
    grid-template-columns: minmax(320px, 5fr) minmax(340px, 6fr);
    margin: 0 auto;
    max-width: 1320px;
    padding: 20px;
  }
  @media (max-width: 940px) {
    main {
      grid-template-columns: 1fr;
    }
  }
  section.panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: 0 1px 2px var(--shadow);
    padding: 18px 20px;
  }
  section.panel + section.panel {
    margin-top: 20px;
  }
  main > section.col1 {
    grid-column: 1;
  }
  main > section.col2 {
    grid-column: 2;
    grid-row: 2 / span 4;
    align-self: start;
    position: sticky;
    top: 40px;
  }
  @media (max-width: 940px) {
    main > section.col1,
    main > section.col2 {
      grid-column: 1;
      grid-row: auto;
      position: static;
    }
  }
  .question {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 22px;
    line-height: 1.35;
    margin: 6px 0 10px;
    text-wrap: balance;
  }
  .machine {
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin: 8px 0 0;
  }
  .chip {
    background: var(--rule-soft);
    border-radius: 2px;
    color: var(--muted);
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 2px 7px;
  }
  blockquote.candidate {
    border-left: 3px solid var(--mark);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    line-height: 1.45;
    margin: 0;
    padding: 4px 0 4px 14px;
  }
  .response {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16.5px;
    line-height: 1.7;
    max-height: 44vh;
    overflow-y: auto;
  }
  .response .s {
    border-radius: 2px;
    padding: 1px 0;
  }
  .response .s.clickable {
    cursor: pointer;
  }
  .response .s.clickable:hover {
    background: var(--rule-soft);
  }
  .response .s.cand {
    background: var(--mark-wash);
    box-shadow: 0 1px 0 var(--mark);
  }
  .response .s.evidence {
    background: var(--bind-wash);
    box-shadow: 0 1px 0 var(--bind);
  }
  .response .s.hidden {
    display: none;
  }
  .response sup.sid {
    color: var(--bind);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    margin-right: 3px;
  }
  .context {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin-top: 4px;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
  }
  .hint {
    border-left: 2px solid var(--rule);
    color: var(--muted);
    display: none;
    font-size: 13px;
    line-height: 1.5;
    margin: 8px 0 12px;
    padding: 2px 0 2px 10px;
  }
  body[data-help='on'] .hint {
    display: block;
  }
  .guide {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    display: none;
    grid-column: 1 / -1;
    padding: 16px 20px;
  }
  body[data-help='on'] .guide {
    display: block;
  }
  body[data-guide='yes'] .guide > :not(.eyebrow) {
    display: none;
  }
  .guide ol {
    margin: 8px 0 0;
    padding-left: 20px;
  }
  .guide li {
    margin-bottom: 4px;
  }
  .guide dl {
    display: grid;
    gap: 4px 12px;
    grid-template-columns: auto 1fr;
    margin: 10px 0 0;
  }
  .guide dt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  .guide dd {
    margin: 0;
  }
  .training {
    background: var(--card);
    border: 1px solid var(--mark);
    border-radius: 3px;
    grid-column: 1 / -1;
    padding: 14px 20px;
  }
  table.grade {
    border-collapse: collapse;
    font-size: 13.5px;
    margin: 12px 0 0;
    width: 100%;
  }
  table.grade th,
  table.grade td {
    border-top: 1px solid var(--rule-soft);
    padding: 6px 10px 6px 0;
    text-align: left;
    vertical-align: top;
  }
  table.grade th {
    font-weight: 500;
    white-space: nowrap;
  }
  table.grade tr.ok td:last-child {
    color: var(--direct);
  }
  table.grade tr.ko td:last-child,
  table.grade tr.ko td:nth-child(2) {
    color: var(--notdirect);
  }
  .lesson {
    border-left: 3px solid var(--mark);
    font-size: 14px;
    line-height: 1.55;
    margin: 12px 0 0;
    padding: 4px 0 4px 12px;
  }
  footer.dock {
    background: var(--card);
    border-top: 1px solid var(--rule);
    bottom: 0;
    box-shadow: 0 -2px 10px var(--shadow);
    left: 0;
    padding: 11px 20px 13px;
    position: fixed;
    right: 0;
    z-index: 15;
  }
  .dock-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin: 0 auto;
    max-width: 1320px;
  }
  .verdicts {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .verdicts button,
  .tri button,
  .ghost {
    background: transparent;
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    padding: 7px 13px;
  }
  .ghost {
    font-size: 13px;
    padding: 6px 11px;
  }
  kbd {
    background: var(--rule-soft);
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    margin-right: 7px;
    padding: 1px 5px;
  }
  .verdicts button[data-v='DIRECT'][aria-pressed='true'] {
    background: var(--direct);
    border-color: var(--direct);
    color: #fff;
  }
  .verdicts button[data-v='NOT_DIRECT'][aria-pressed='true'] {
    background: var(--notdirect);
    border-color: var(--notdirect);
    color: #fff;
  }
  .verdicts button[data-v='AMBIGUOUS'][aria-pressed='true'] {
    background: var(--ambiguous);
    border-color: var(--ambiguous);
    color: #fff;
  }
  .verdicts button[aria-pressed='true'] kbd {
    background: rgba(255, 255, 255, 0.22);
  }
  .tri {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tri button {
    font-size: 13px;
    padding: 4px 10px;
  }
  .tri button[aria-pressed='true'] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--card);
  }
  .ctl-label {
    font-size: 12.5px;
    margin-bottom: 3px;
  }
  #verdictQuestion {
    font-size: 12.5px;
    letter-spacing: 0;
    max-width: 560px;
    text-transform: none;
  }
  #verdictQuestion em {
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 14px;
    font-style: normal;
  }
  .todo {
    color: var(--notdirect);
    font-size: 12.5px;
  }
  .todo.ok {
    color: var(--direct);
  }
  input[type='text'] {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    font: inherit;
    padding: 8px 10px;
    width: 100%;
  }
  textarea {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.45;
    min-height: 200px;
    padding: 10px;
    width: 100%;
  }
  .hash {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    word-break: break-all;
  }
  ul.blockers {
    color: var(--notdirect);
    font-size: 13.5px;
    margin: 8px 0 0;
    padding-left: 20px;
  }
  button.link {
    background: none;
    border: 0;
    color: var(--bind);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 0;
    text-decoration: underline;
  }
  :focus-visible {
    outline: 2px solid var(--mark);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<div class="rail" id="rail" role="navigation" aria-label="Progression"></div>
<header class="bar">
  <div>
    <div class="eyebrow">Relecture à l’aveugle</div>
    <strong
      >Pour chaque carte : une question, et ce qui te fait répondre.</strong
    >
  </div>
  <div class="grow"></div>
  <div class="count" id="progress">—</div>
  <button class="ghost" id="train">entraînement</button>
  <button class="ghost" id="help"><kbd>H</kbd>aide</button>
  <span id="whoBox" style="display: inline-flex; gap: 6px; align-items: center"
    ><button class="ghost" id="who">relecteur…</button
    ><input
      id="whoInput"
      type="text"
      placeholder="ton identifiant"
      autocomplete="off"
      hidden
      style="width: 160px; padding: 5px 8px"
    /><button class="ghost" id="whoSave" hidden>enregistrer</button></span
  >
  <button class="ghost" id="toExport">export</button>
</header>
<main id="app"></main>
<footer class="dock" hidden id="dock">
  <div class="dock-inner">
    <div>
      <div class="eyebrow" id="verdictQuestion">La question</div>
      <div class="verdicts" id="verdicts">
        <button data-v="DIRECT" aria-pressed="false"><kbd>O</kbd>oui</button>
        <button data-v="NOT_DIRECT" aria-pressed="false">
          <kbd>N</kbd>non
        </button>
        <button data-v="AMBIGUOUS" aria-pressed="false">
          <kbd>?</kbd>je ne peux pas dire
        </button>
      </div>
    </div>
    <div>
      <div class="ctl-label">
        <kbd>S</kbd> <strong>Autre phrase.</strong> Si on retirait la phrase
        examinée, une autre phrase de la copie suffirait-elle, seule, à répondre
        oui&nbsp;?
      </div>
      <div class="tri" id="altTri"></div>
      <div class="ctl-label" style="margin-top: 6px">
        <kbd>V</kbd> <strong>Informations.</strong> Avais-tu tout ce qu’il
        fallait pour répondre&nbsp;?
      </div>
      <div class="tri" id="viewTri"></div>
    </div>
    <div class="grow" style="min-width: 300px">
      <input
        id="why"
        type="text"
        placeholder="pourquoi ? (obligatoire si « je ne peux pas dire »)"
        autocomplete="off"
      />
      <div class="todo" id="todo" style="margin-top: 6px"></div>
    </div>
    <div style="align-self: center">
      <button class="ghost" id="prev">◀</button>
      <button class="ghost" id="next">▶</button>
    </div>
  </div>
</footer>

<script id="deck" type="application/json">
  /*__DECK__*/
</script>
<script id="questions" type="application/json">
  /*__QUESTIONS__*/
</script>
<script>
  const DECK = JSON.parse(document.getElementById('deck').textContent);
  const QUESTIONS = JSON.parse(
    document.getElementById('questions').textContent,
  );
  const CARDS = DECK.cards;
  const STORE = 'adj-v4-' + DECK.manifestHash.slice(-12);
  const ABSTENTION_CAP = 0.2; // pre-declared: above this share of « je ne peux pas dire », the pass is suspended

  const escapeHtml = (v) =>
    v.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const singleSpan = (card) => /^S[123]_/.test(card.stratum);
  const wholeCopy = (card) => card.stratum.startsWith('S7');
  const bindableRoles = (card) => card.argumentRoles.filter((r) => r.bindable);
  const ROLE_WORDS = {
    choice: 'l’option que l’élève retient',
    claim: 'ce que l’élève affirme',
    datum: 'les faits, chiffres ou dates que l’élève avance',
    fact: 'les faits que l’élève utilise',
    limit: 'la limite que l’élève énonce',
    mitigation: 'la parade que l’élève propose',
    position: 'la position que l’élève prend',
    precaution: 'la précaution que l’élève propose',
    risk: 'le risque que l’élève nomme',
    uncertainty: 'l’incertitude que l’élève nomme',
    sequence: 'la séquence que l’élève décrit',
    mechanism: 'le mécanisme ou la conclusion que l’élève énonce',
    proof: 'la preuve que l’élève produit',
    link: 'le lien réflexif que l’élève énonce',
    element: 'l’élément concret de la réponse',
    action: 'l’action proposée',
    decision: 'la décision prise',
    operation: 'le calcul',
    comparison: 'la comparaison',
    interpretation: 'l’interprétation de la preuve',
    material_claim: 'une affirmation importante',
    practice: 'la pratique demandée',
  };
  const roleWords = (r) =>
    ROLE_WORDS[r.roleId] || (r.description || r.roleId).split(' — ')[0];
  /** How many sentences a multi-sentence card needs: one per thing the question relates. */
  const neededEvidence = (card) =>
    Math.max(1, Math.min(bindableRoles(card).length, card.sentences.length));
  const questionFor = (card) =>
    card.plainQuestion || QUESTIONS.questions[card.atomId] || card.atom;
  function familyWords(stratum) {
    const ctx = stratum.includes('dossier')
      ? 'consigne et dossier'
      : stratum.includes('frame')
        ? 'consigne seule'
        : 'copie seule';
    return (
      (singleSpan({ stratum })
        ? 'une phrase'
        : wholeCopy({ stratum })
          ? 'copie entière'
          : 'plusieurs phrases') +
      ' · ' +
      ctx
    );
  }

  /* ---------- warm-up: eight invented cards, one trap each, unambiguous ---------- */
  function splitSentences(text) {
    const out = [];
    const re = /[^.!?]+[.!?]+/g;
    let m;
    let i = 0;
    while ((m = re.exec(text))) {
      const lead = m[0].length - m[0].trimStart().length;
      out.push({
        end: m.index + m[0].length,
        id: 's' + i,
        start: m.index + lead,
      });
      i += 1;
    }
    return out;
  }
  const role = (roleId, cardinality, source) => ({
    bindable: (source || 'response') === 'response',
    cardinality,
    description: roleId,
    roleId,
    source: source || 'response',
  });
  const TRAINING_SPECS = [
    {
      id: 'E1',
      stratum: 'S1_span_local',
      atom: 'un choix est explicitement énoncé',
      question: 'L’élève dit-il clairement quelle option il retient ?',
      roles: [role('choice', '1')],
      response:
        'Le fournisseur B livre en 2 jours et n’a eu aucun retard en 2025. Le fournisseur A coûte 2 500 euros de moins par an. Les deux ont été audités en mars.',
      candidate: 0,
      expected: {
        verdict: 'NOT_DIRECT',
        evidenceIncludes: [],
        alternativeSupport: 'no',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'La phrase parle des délais de B ; elle ne dit pas ce que l’élève retient. On ne devine pas : non. Aucune autre phrase ne le dit non plus, donc S : non.',
    },
    {
      id: 'E2',
      stratum: 'S5_multi_frame',
      atom: 'CHAQUE donnée de l’ensemble est pertinente pour CE choix',
      question:
        'CHAQUE fait ou chiffre avancé a-t-il un rapport avec le choix que l’élève a fait, au regard de la consigne ?',
      roles: [
        role('datum', '>=2'),
        role('choice', '1'),
        role('task_frame', '1', 'task_frame'),
      ],
      frame:
        'Choisis l’un des deux fournisseurs pour 2026 et justifie avec des chiffres.',
      response:
        'Je retiens le fournisseur A. Il livre en 5 jours et n’a eu que 2 retards en 2025, ce qui reste acceptable pour nous. Notre parking compte 40 places.',
      candidate: 1,
      expected: {
        verdict: 'NOT_DIRECT',
        evidenceIncludes: ['s2'],
        evidenceWords: 'la phrase hors sujet, s2 (le parking), ET le choix, s0',
        alternativeSupport: 'no',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'La question dit CHAQUE. Les chiffres de s1 ont un rapport avec le choix ; « 40 places de parking » n’en a aucun. Un seul hors sujet, et la réponse est non. Ce qui te fait dire non, c’est s2 : c’est elle que tu surlignes.',
    },
    {
      id: 'E3',
      stratum: 'S3_span_dossier',
      atom: 'CHAQUE affirmation utile est fidèle au contexte',
      question:
        'CHAQUE affirmation utile de ce passage est-elle conforme au dossier ?',
      roles: [role('claim', '>=1'), role('dossier', '1', 'dossier')],
      frame:
        'Rédige un objectif de 80 à 120 mots précisant population, processus, résultat, horizon et hypothèses.',
      dossier:
        'Le processus visé est le tri des tickets du support de niveau 1. L’équipe compte 12 personnes. Aucune mesure de durée n’existe encore.',
      response:
        'L’équipe compte 12 personnes. Le processus visé est le tri des tickets du support de niveau 1.',
      candidate: 0,
      expected: {
        verdict: 'DIRECT',
        evidenceIncludes: [],
        alternativeSupport: 'yes',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'La copie est très incomplète au regard de la consigne, et la question ne parle pas de ça : elle parle de conformité au dossier. « L’équipe compte 12 personnes » est dans le dossier mot pour mot : oui. Et s1 est conforme aussi, donc si on retirait s0, s1 suffirait seule : S oui.',
    },
    {
      id: 'E4',
      stratum: 'S3_span_dossier',
      atom: 'CHAQUE donnée reprise est exacte',
      question:
        'CHAQUE fait ou chiffre avancé est-il exact, d’après le dossier ?',
      roles: [role('datum', '>=1'), role('dossier', '1', 'dossier')],
      frame: 'Résume les coûts du dossier.',
      dossier:
        'Le contrat Préventel coûte 12 500 euros par an. Le contrat Vigil coûte 18 000 euros par an.',
      response:

    try {

    document.body.dataset.help =
      document.body.dataset.help === 'on' ? 'off' : 'on';

    }

  /* Time on card: the audit asks for order and seconds per card in the export. */
  let enteredAt = Date.now();

    const card = activeCards()[getIndex()];

    enteredAt = Date.now();
  }

  function decisionFor(card) {
    const bag = activeDecisions();
    if (!bag[card.cardId]) {
      bag[card.cardId] = {
        alternativeSupport: null,
        cardId: card.cardId,
        decidedAt: null,
        evidenceSentenceIds: [],
        evidenceViewComplete: null,
        firstSeenAt: new Date().toISOString(),

    const d = decisionFor(card);
    const list = [];
    if (!d.verdict) list.push('réponse');
    if (
      (d.verdict === 'DIRECT' || d.verdict === 'NOT_DIRECT') &&
      !singleSpan(card) &&
      !wholeCopy(card) &&
      d.evidenceSentenceIds.length < neededEvidence(card)

        neededEvidence(card) > 1
          ? 'surligne une phrase pour chaque chose reliée (' +

  /* ---------- warm-up grading ---------- */
  function grade(card, d) {
    const spec = TRAINING.find((t) => t.card.cardId === card.cardId);
    if (!spec) return null;
    const words = {
      AMBIGUOUS: 'je ne peux pas dire',
      DIRECT: 'oui',
      NOT_DIRECT: 'non',
    };
    const yn = (v) => (v === 'yes' ? 'oui' : v === 'no' ? 'non' : '—');
    const rows = [
      {
        expected: words[spec.expected.verdict],
        field: 'réponse',
        ok: d.verdict === spec.expected.verdict,
        yours: words[d.verdict] || '—',
      },
    ];
    if (!singleSpan(card)) {
      const got = d.evidenceSentenceIds;
      const need = spec.expected.evidenceIncludes;
      const ok = need.every((id) => got.includes(id));
      rows.push({
        expected: need.length
          ? spec.expected.evidenceWords || 'au moins ' + need.join(', ')
          : 'libre',
        field: 'phrases surlignées',
        ok,
        yours: got.length ? got.join(', ') : 'aucune',
      });
    }
    if (!wholeCopy(card))
      rows.push({
        expected: yn(spec.expected.alternativeSupport),
        field: 'S · autre phrase',
        ok: d.alternativeSupport === spec.expected.alternativeSupport,
        yours: yn(d.alternativeSupport),
      });
    rows.push({
      expected: yn(spec.expected.evidenceViewComplete),
      field: 'V · rien ne manquait',
      ok: d.evidenceViewComplete === spec.expected.evidenceViewComplete,
      yours: yn(d.evidenceViewComplete),
    });
    return { lesson: spec.lesson, rows };
  }

  function renderResponse(card, d) {
    const revealed = d.revealed === true || !card.window;
    const clickable = !singleSpan(card);
    let html = '';
    let cursor = 0;
    for (const s of card.sentences) {
      if (s.start > cursor)
        html += escapeHtml(card.response.slice(cursor, s.start));
      const inWindow =
        !card.window ||
        (s.start < card.window.end && s.end > card.window.start);
      const cls = ['s'];
      if (clickable) cls.push('clickable');
      if (card.candidateSentenceIds.includes(s.id)) cls.push('cand');
      if (d.evidenceSentenceIds.includes(s.id)) cls.push('evidence');
      if (!inWindow && !revealed) cls.push('hidden');
      html +=
        '<span class="' +
        cls.join(' ') +
        '" data-s="' +
        s.id +
        '">' +
        (clickable ? '<sup class="sid">' + s.id + '</sup>' : '') +
        escapeHtml(card.response.slice(s.start, s.end)) +
        '</span>';

          if (g) b.dataset.g = g.rows.every((r) => r.ok) ? 'ok' : 'ko';

      try {
        localStorage.setItem(HELP_STORE, 'on');
        localStorage.setItem(GUIDE_STORE, 'no');
      } catch (e) {
        /* preference */
      }
      render();
      window.scrollTo({ top: 0 });
    };
    for (const b of document.querySelectorAll('#verdicts button'))
      b.setAttribute('aria-pressed', String(b.dataset.v === d.verdict));
    if (wholeCopy(card)) {
      d.alternativeSupport = 'not_applicable';
      document.getElementById('altTri').innerHTML =
        '<span class="chip">sans objet : la question porte déjà sur toute la copie</span>';
    } else {
      if (d.alternativeSupport === 'not_applicable')
        d.alternativeSupport = null;
      tri(document.getElementById('altTri'), 'alternativeSupport');
    }
    tri(document.getElementById('viewTri'), 'evidenceViewComplete');
    document.getElementById('why').value = d.rationale || '';
    const todo = document.getElementById('todo');
    const missing = blockers(card);
    todo.className = 'todo' + (missing.length ? '' : ' ok');
    todo.textContent = todoText(card);
    document.getElementById('dock').hidden = false;
    const done = activeCards().filter(
      (c) => activeDecisions()[c.cardId] && complete(c),
    ).length;
    document.getElementById('progress').textContent =
      (inTraining() ? 'entraînement ' : 'carte ') +
      (getIndex() + 1) +
      ' / ' +
      activeCards().length +
      ' · ' +
      done +
      ' complètes';
    document.getElementById('who').textContent = state.reviewer || 'relecteur…';
    for (const s of document.querySelectorAll('#resp .s.clickable')) {
      s.onclick = () => {
        const id = s.dataset.s;
        d.evidenceSentenceIds = d.evidenceSentenceIds.includes(id)
          ? d.evidenceSentenceIds.filter((x) => x !== id)
          : [...d.evidenceSentenceIds, id];
        touch();
      };
    }
    const reveal = document.getElementById('reveal');
    if (reveal)
      reveal.onclick = () => {
        d.revealed = true;
        if (!d.verdict) d.revealedBeforeVerdict = true;
        touch();
      };
    const gt = document.getElementById('guideToggle');
    if (gt) {
      gt.textContent =
        document.body.dataset.guide === 'yes' ? 'déplier' : 'replier';
      gt.onclick = () => {
        document.body.dataset.guide =
          document.body.dataset.guide === 'yes' ? 'no' : 'yes';
        try {
          localStorage.setItem(GUIDE_STORE, document.body.dataset.guide);
        } catch (e) {
          /* preference */
        }
        render();
      };
    }
    const tn = document.getElementById('trainNext');
    if (tn) tn.onclick = () => advance(1);
    const td = document.getElementById('trainDone');
    if (td)
      td.onclick = () => {
        leaveCurrent();
        training.done = true;
        state.index = 0;
        enteredAt = Date.now();
        persist();
        render();
      };
    renderRail();
  }

  function record(verdict) {
    const card = activeCards()[getIndex()];
    const d = decisionFor(card);
    d.verdict = verdict;
    d.decidedAt = new Date().toISOString();
    d.reviewerId = state.reviewer;
    persist();
    render();
    if (complete(card) && !inTraining()) advance(1);
  }
  function advance(step) {
    leaveCurrent();
    setIndex(
      Math.min(activeCards().length - 1, Math.max(0, getIndex() + step)),
    );
    persist();
    render();
  }

  for (const b of document.querySelectorAll('#verdicts button'))
    b.onclick = () => record(b.dataset.v);
  document.getElementById('prev').onclick = () => advance(-1);
  document.getElementById('next').onclick = () => advance(1);
  document.getElementById('help').onclick = toggleHelp;
  // A system confirm() is blocked where this page is hosted, like prompt():
  // the second click within five seconds is the confirmation.
  let trainArmedAt = 0;
  document.getElementById('train').onclick = () => {
    const button = document.getElementById('train');
    if (!inTraining() && Date.now() - trainArmedAt > 5000) {
      trainArmedAt = Date.now();
      button.textContent =
        'reclique pour refaire l’échauffement (tes vraies décisions sont gardées)';
      setTimeout(() => {
        button.textContent = 'entraînement';
      }, 5000);
      return;
    }
    training.done = false;
    training.decisions = {};
    training.index = 0;
    button.textContent = 'entraînement';
    persist();
    render();
  };
  document.getElementById('why').oninput = () => {
    const card = activeCards()[getIndex()];
    decisionFor(card).rationale = document.getElementById('why').value.trim();
    persist();
    const todo = document.getElementById('todo');
    const m = blockers(card);
    todo.className = 'todo' + (m.length ? '' : ' ok');
    todo.textContent = todoText(card);
  };
  document.getElementById('who').onclick = () => {
    const input = document.getElementById('whoInput');
    const save = document.getElementById('whoSave');
    input.hidden = false;
    save.hidden = false;
    input.value = state.reviewer;
    input.focus();
  };
  const saveReviewer = () => {
    const input = document.getElementById('whoInput');
    state.reviewer = input.value.trim();
    input.hidden = true;
    document.getElementById('whoSave').hidden = true;
    touch();
  };
  document.getElementById('whoSave').onclick = saveReviewer;
  document.getElementById('whoInput').onkeydown = (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      saveReviewer();
    }
    if (event.key === 'Escape') {
      document.getElementById('whoInput').hidden = true;
      document.getElementById('whoSave').hidden = true;
    }
  };
  const cycle = (field) => {
    const d = decisionFor(activeCards()[getIndex()]);
    const order = [null, 'yes', 'no'];
    d[field] = order[(order.indexOf(d[field]) + 1) % order.length];
    touch();
  };
  if (window.__adjudicationKeydown)
    removeEventListener('keydown', window.__adjudicationKeydown);
  window.__adjudicationKeydown = (event) => {
    const t = event.target;
    if (t instanceof Element && t.matches('input, textarea')) {
      if (event.key === 'Escape' && t instanceof HTMLElement) t.blur();
      return;
    }
    const k = event.key.toLowerCase();
    if (k === 'o') record('DIRECT');
    else if (k === 'n') record('NOT_DIRECT');
    else if (event.key === '?') record('AMBIGUOUS');
    else if (k === 's') cycle('alternativeSupport');
    else if (k === 'v') cycle('evidenceViewComplete');
    else if (k === 'h') {
      toggleHelp();
      render();
    } else if (k === 'j') {
      event.preventDefault();
      document.getElementById('why').focus();
    } else if (event.key === 'ArrowLeft') advance(-1);
    else if (event.key === 'ArrowRight') advance(1);
  };
  addEventListener('keydown', window.__adjudicationKeydown);

  /* ---------- export: same contract; the schema is derived, not asked ---------- */
  function canonical(v) {
    if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
    if (v && typeof v === 'object')
      return (
        '{' +
        Object.keys(v)
          .sort()
          .map((k) => JSON.stringify(k) + ':' + canonical(v[k]))
          .join(',') +
        '}'
      );
    return JSON.stringify(v);
  }
  function derivedRoles(card, d) {
    const roles = bindableRoles(card);
    const evidence = effectiveEvidence(card, d);
    const out = {};
    if (roles.length === 1) {
      out[roles[0].roleId] = {
        derivation: 'single-role',
        sentenceIds: evidence,
        status: evidence.length ? 'BOUND' : 'ABSENT',
      };
    } else
      for (const r of roles)
        out[r.roleId] = {
          derivation: 'pass-2',
          sentenceIds: evidence,
          status: 'PENDING_PASS2',
        };
    return out;
  }
  document.getElementById('toExport').onclick = async () => {
    document.getElementById('dock').hidden = true;
    const back = () => {
      document.getElementById('dock').hidden = false;
      render();
    };
    if (inTraining()) {
      document.getElementById('app').innerHTML =
        '<div style="grid-column:1 / -1"><section class="panel"><div class="eyebrow">Export indisponible</div><p class="note">L’échauffement n’est pas terminé.</p><p><button class="ghost" id="back">retour</button></p></section></div>';
      document.getElementById('back').onclick = back;
      return;
    }
    leaveCurrent();
    const refusals = [];
    if (!state.reviewer) refusals.push('aucun identifiant de relecteur');
    const incomplete = CARDS.filter((c) => !complete(c));
    if (incomplete.length)
      refusals.push(
        incomplete.length + ' cartes incomplètes sur ' + CARDS.length,
      );
    const abstentions = CARDS.filter(
      (c) =>
        state.decisions[c.cardId] &&
        state.decisions[c.cardId].verdict === 'AMBIGUOUS',
    ).length;
    const share = abstentions / CARDS.length;
    if (incomplete.length === 0 && share > ABSTENTION_CAP)
      refusals.push(
        'passe suspendue : ' +
          abstentions +
          ' « je ne peux pas dire » sur ' +
          CARDS.length +
          ' (' +
          Math.round(share * 100) +
          ' %), au-delà du plafond pré-déclaré de 20 %',
      );
    if (refusals.length) {
      document.getElementById('app').innerHTML =
        '<div style="grid-column:1 / -1"><section class="panel"><div class="eyebrow">Export refusé</div><ul class="blockers">' +
        refusals.map((r) => '<li>' + escapeHtml(r) + '</li>').join('') +
        '</ul>' +
        (incomplete.length
          ? '<ul class="blockers">' +
            incomplete
              .slice(0, 12)
              .map(
                (c) =>
                  '<li>' +
                  escapeHtml(c.cardId) +
                  ' — ' +
                  escapeHtml(blockers(c).join(', ')) +
                  '</li>',
              )
              .join('') +
            '</ul>'
          : '') +
        '<p><button class="ghost" id="back">retour aux cartes</button></p></section></div>';
      document.getElementById('back').onclick = back;
      return;
    }
    const payload = {
      abstentionShare: share,
      atomTaxonomyHash: DECK.atomTaxonomyHash,
      deckHash: DECK.contentHash,
      deckSeed: DECK.shuffleSeed,
      decisions: CARDS.map((c) => {
        const d = state.decisions[c.cardId];
        return {
          alternativeSupport: d.alternativeSupport,
          cardId: c.cardId,
          decidedAt: d.decidedAt,
          evidenceSentenceIds: effectiveEvidence(c, d),
          evidenceViewComplete: d.evidenceViewComplete,
          firstSeenAt: d.firstSeenAt,
          orderIndex: d.orderIndex,
          rationale: d.rationale,
          revealedBeforeVerdict: d.revealedBeforeVerdict === true,
          reviewerId: d.reviewerId || state.reviewer,
          roleAssessments: derivedRoles(c, d),
          secondsOnCard: d.secondsOnCard || 0,
          verdict: d.verdict,
        };
      }).sort((a, b) => a.cardId.localeCompare(b.cardId)),
      manifestHash: DECK.manifestHash,
      pass: 1,
      questionsHash: QUESTIONS.contentHash || null,
      schemaVersion: 4,
    };
    const text = canonical(payload);
    let digest = 'indisponible hors https';
    if (globalThis.crypto && crypto.subtle) {
      const bytes = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(text),
      );
      digest =
        'sha256:' +
        [...new Uint8Array(bytes)]
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
    }
    document.getElementById('app').innerHTML =
      '<div style="grid-column:1 / -1"><section class="panel"><div class="eyebrow">Export de la passe 1</div><p class="note">' +
      payload.decisions.length +
      ' décisions. Enregistre ce texte tel quel dans <code>benchmarks/ai-correction/regression/adjudication-pass1.v1.json</code>. Toute modification ultérieure produit une nouvelle version.</p><p class="hash"><strong>empreinte du texte ci-dessous :</strong> ' +
      digest +
      '</p><p><button class="ghost" id="copy">copier</button> <button class="ghost" id="back">retour aux cartes</button></p><textarea readonly id="out">' +
      escapeHtml(text) +
      '</textarea></section></div>';
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('copy').textContent = 'copié';
      } catch (e) {
        document.getElementById('out').select();
        document.getElementById('copy').textContent = 'sélectionné — ⌘C';
      }
    };
    document.getElementById('back').onclick = back;
  };

  render();
</script>
