  /*__DECK__*/

<script>
  const DECK = JSON.parse(document.getElementById('deck').textContent);
  const CARDS = DECK.cards;

  /* ------------------------------------------------------------------ *
   * Échauffement : huit cartes inventées, une par piège, avec correction
   * immédiate. Rien ici ne vient du paquet réel et rien n'en sort : les
   * décisions d'entraînement vivent sous leur propre clé et ne sont jamais
   * exportées. La vraie passe reste verrouillée tant qu'il n'est pas fini.
   * ------------------------------------------------------------------ */
  function splitSentences(text) {
    const out = [];
    const re = /[^.!?]+[.!?]+/g;
    let m;
    let index = 0;
    while ((m = re.exec(text))) {
      const raw = m[0];
      const lead = raw.length - raw.trimStart().length;
      out.push({
        end: m.index + raw.length,
        id: 's' + index,
        start: m.index + lead,
      });
      index += 1;
    }
    return out;
  }
  const role = (roleId, description, cardinality, source) => ({
    bindable: (source || 'response') === 'response',
    cardinality,
    description,
    roleId,
    source: source || 'response',
  });
  const TRAINING_SPECS = [
    {
      id: 'E1',
      atom: 'un choix est explicitement énoncé',
      predicate: 'stated',
      quantifier: 'exists',
      criterion: 'Position de décision',
      sourcePhrase: 'Le choix est explicite',
      stratum: 'S1_span_local',
      arity: '1',
      roles: [role('choice', 'choix retenu', '1')],
      response:
        'Le fournisseur B livre en 2 jours et n’a eu aucun retard en 2025. Le fournisseur A coûte 2 500 euros de moins par an. Les deux ont été audités en mars.',
      candidate: 0,
      expected: {
        verdict: 'NOT_DIRECT',
        roles: { choice: { status: 'ABSENT' } },
        alternativeSupport: 'no',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'Aucune phrase ne dit ce que l’élève retient. Le témoin « choice » n’existe pas dans la copie : on le marque absent, on ne l’invente pas. Et sans choix énoncé, la phrase ne peut pas prouver qu’un choix est explicitement énoncé : non.',
    },
    {
      id: 'E2',
      atom: 'CHAQUE donnée de l’ensemble est pertinente pour CE choix',
      predicate: 'relevant',
      quantifier: 'forall',
      criterion: 'Fidélité aux faits du dossier',
      sourcePhrase: 'pertinentes',
      stratum: 'S5_multi_frame',
      arity: 'n',
      roles: [
        role('datum', 'donnée mobilisée', '>=2'),
        role('choice', 'choix retenu', '1'),
        role('task_frame', 'la consigne', '1', 'task_frame'),
      ],
      frame:
        'Choisis l’un des deux fournisseurs pour 2026 et justifie avec des chiffres.',
      response:
        'Je retiens le fournisseur A. Le fournisseur B livre en 2 jours et n’a eu aucun retard, ce qui est remarquable. Notre entrepôt a été repeint en mars.',
      candidate: 1,
      expected: {
        verdict: 'NOT_DIRECT',
        roles: {
          choice: { status: 'BOUND', sentenceIds: ['s0'] },
          datum: { status: 'BOUND', sentenceIds: ['s1', 's2'] },
        },
        alternativeSupport: 'no',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'Tout est vrai, et rien ne sert le choix de A : les données de s1 plaident pour B, celle de s2 ne plaide pour rien. « forall » casse dès la première donnée hors sujet. Une phrase vraie, chiffrée et bien écrite peut être un non.',
    },
    {
      id: 'E3',
      atom: 'CHAQUE affirmation utile est fidèle au contexte',
      predicate: 'faithful',
      quantifier: 'forall',
      criterion: 'Fidélité et limites',
      sourcePhrase: 'Les affirmations utiles sont fidèles au contexte',
      stratum: 'S3_span_dossier',
      arity: '1',
      roles: [
        role('claim', 'affirmation utile', '>=1'),
        role('dossier', 'le dossier', '1', 'dossier'),
      ],
      frame:
        'Rédige un objectif de 80 à 120 mots précisant population, processus, résultat, horizon et hypothèses.',
      dossier:
        'Le processus visé est le tri des tickets du support de niveau 1. L’équipe compte 12 personnes. Aucune mesure de durée n’existe encore.',
      response:
        'Le tri des tickets du support de niveau 1 est assuré par les 12 personnes de l’équipe. Aucune durée n’a encore été mesurée.',
      candidate: 0,
      expected: {
        verdict: 'DIRECT',
        roles: { claim: { status: 'BOUND', sentenceIds: ['s0'] } },
        alternativeSupport: 'yes',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'La copie est très incomplète au regard de la consigne, et ça ne compte pas ici : l’affirmation parle de fidélité. Tout ce que s0 avance est dans le dossier, mot pour mot : oui. L’incomplétude est une autre affirmation, sur une autre carte. Et s1 est fidèle aussi, donc « une autre phrase la prouve » : oui.',
    },

    },
    {
      id: 'E8',
      atom: 'la limite énoncée porte sur le choix retenu',
      predicate: 'about',
      quantifier: 'exists',
      criterion: 'Limites du choix',
      sourcePhrase: 'une limite de son choix',
      stratum: 'S2_span_frame',
      arity: '1',
      roles: [
        role('limit', 'limite énoncée', '1'),
        role('choice', 'choix retenu', '1'),
        role('task_frame', 'la consigne', '1', 'task_frame'),
      ],
      frame:
        'Choisis une des deux options et indique la principale limite de ton choix.',
      response:
        'Je retiens l’option A. L’option B présente le défaut d’exiger une formation de trois jours. Le calendrier sera précisé plus tard.',
      candidate: 1,
      expected: {
        verdict: 'NOT_DIRECT',
        roles: {
          choice: { status: 'BOUND', sentenceIds: ['s0'] },
          limit: { status: 'BOUND', sentenceIds: ['s1'] },
        },
        alternativeSupport: 'no',
        evidenceViewComplete: 'yes',
      },
      lesson:
        'La consigne demande une limite du choix retenu. L’élève énonce bien une limite, mais celle de l’option B, qu’il n’a pas retenue. La consigne te dit ce qu’on lui a demandé ; l’affirmation te dit ce que tu dois vérifier. Ce sont deux questions.',
    },
  ];
  const TRAINING = TRAINING_SPECS.map((t) => {
    const sentences = splitSentences(t.response);
    const cs = sentences[t.candidate];
    let window = null;
    if (t.window) {
      const centre = (cs.start + cs.end) / 2;
      window = {
        end: Math.min(
          t.response.length,
          Math.max(cs.end, Math.round(centre + 120)),
        ),
        start: Math.max(0, Math.min(cs.start, Math.round(centre - 120))),
      };
    }
    return {
      card: {
        argumentRoles: t.roles,
        atom: t.atom,
        atomId: 'train.' + t.id,
        candidateSentenceIds: [cs.id],
        candidateSpan: t.response.slice(cs.start, cs.end).trim(),
        cardId: t.id,
        criterionLabel: t.criterion,
        ...(t.dossier ? { dossier: t.dossier } : {}),
        ...(t.frame ? { frame: t.frame } : {}),
        highlight: { end: cs.end, start: cs.start },
        logicalOperator: 'none',
        predicate: t.predicate,
        quantifier: t.quantifier,
        response: t.response,
        responseArity: t.arity,
        sentences,
        sourcePhrase: t.sourcePhrase,
        stratum: t.stratum,
        window,
        witnessGroupId: 'entraînement',
      },
      expected: t.expected,
      lesson: t.lesson,
    };
  });

  const TRAINING_STORE = 'adj-training';
  const training = { decisions: {}, done: false, index: 0 };
  try {
    Object.assign(
      training,
      JSON.parse(localStorage.getItem(TRAINING_STORE) || '{}'),
    );
  } catch (error) {
    /* start with the warm-up */
  }
  const inTraining = () => !training.done;
  const activeCards = () =>
    inTraining() ? TRAINING.map((t) => t.card) : CARDS;
  const activeDecisions = () =>
    inTraining() ? training.decisions : state.decisions;
  const getIndex = () => (inTraining() ? training.index : state.index);
  const setIndex = (value) => {
    if (inTraining()) training.index = value;
    else state.index = value;
  };

  /** Compares a warm-up decision with what the card was built to teach. */
  function grade(card, decision) {
    const spec = TRAINING.find((t) => t.card.cardId === card.cardId);
    if (!spec) return null;
    const rows = [];
    const words = {
      AMBIGUOUS: 'impossible à dire',
      DIRECT: 'oui, elle la prouve',
      NOT_DIRECT: 'non',
    };
    rows.push({
      expected: words[spec.expected.verdict],
      field: 'verdict',
      ok: decision.verdict === spec.expected.verdict,
      yours: words[decision.verdict] || '—',
    });
    for (const r of card.argumentRoles.filter((x) => x.bindable)) {
      const want = spec.expected.roles[r.roleId] || { status: 'ABSENT' };
      const got = decision.roleAssessments[r.roleId] || {
        sentenceIds: [],
        status: null,
      };
      const same = (a, b) =>
        JSON.stringify([...a].sort()) === JSON.stringify([...b].sort());
      const ok =
        got.status === want.status &&
        (want.status !== 'BOUND' ||
          same(got.sentenceIds, want.sentenceIds || []));
      const show = (x) =>
        x.status === 'BOUND'
          ? 'lié : ' + (x.sentenceIds || []).join(', ')
          : x.status === 'ABSENT'
            ? 'absent'
            : x.status === 'AMBIGUOUS'
              ? 'ambigu'
              : '—';
      rows.push({
        expected: show(want),
        field: 'témoin ' + r.roleId,
        ok,
        yours: show(got),
      });
    }
    const yn = (v) => (v === 'yes' ? 'oui' : v === 'no' ? 'non' : '—');
    rows.push({
      expected: yn(spec.expected.alternativeSupport),
      field: 'S · autre phrase',
      ok: decision.alternativeSupport === spec.expected.alternativeSupport,
      yours: yn(decision.alternativeSupport),
    });
    rows.push({
      expected: yn(spec.expected.evidenceViewComplete),
      field: 'V · rien ne manquait',
      ok: decision.evidenceViewComplete === spec.expected.evidenceViewComplete,
      yours: yn(decision.evidenceViewComplete),
    });
    return { lesson: spec.lesson, rows };
  }
  const STORE = 'adj-v3-' + DECK.manifestHash.slice(-12);
  /**
   * There is no proposed value.
   *
   * v2 kept both controls technically null but pre-selected « non » and « oui »
   * visually, and let one keystroke confirm both together. That anchors the
   * answer to « autre soutien = non » — a default in everything but storage.
   * Each control is now an independent, unprompted choice.
   */

  const state = { decisions: {}, index: 0, reviewer: '' };
  try {
    Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}'));
  } catch (error) {
    /* private window or blocked storage: start clean rather than fail */
  }
  let armedRole = null;

  /** Plain-language help, off by default for a reviewer who knows the grid. */
  const HELP_STORE = 'adj-help';
  try {
    document.body.dataset.help = localStorage.getItem(HELP_STORE) || 'off';
  } catch (error) {
    document.body.dataset.help = 'off';
  }
  function toggleHelp() {
    document.body.dataset.help =
      document.body.dataset.help === 'on' ? 'off' : 'on';
    try {
      localStorage.setItem(HELP_STORE, document.body.dataset.help);
    } catch (error) {
      /* preference only */
    }
  }

  /** What the quantifier means for this card, in one sentence. */
  function quantifierHint(quantifier) {
    return (
      {
        exists: 'Il suffit qu’UNE occurrence le fasse.',
        forall:
          'Pour TOUTES les occurrences : une seule hors sujet, et la réponse est non.',
        forall_exists:
          'Pour CHAQUE élément du premier rôle, il doit exister un élément du second qui lui répond.',
        not_exists:
          'Il ne doit y en avoir AUCUNE : ici, l’absence est ce qui établit l’atome.',
      }[quantifier] || 'Voir la formule ci-dessus.'
    );
  }
  const hint = (text) => '<p class="hint">' + text + '</p>';

  /** Cardinality as a reviewer reads it. */
  function cardinalityWords(cardinality) {
    return (
      {
        1: '1 phrase, exactement',
        '>=0': 'aucune ou plusieurs phrases',
        '>=1': 'au moins 1 phrase',
        '>=2': 'au moins 2 phrases',
      }[cardinality] || cardinality
    );
  }
  /** The role's meaning, without the taxonomy's technical annotation. */
  const plainDescription = (role) => role.description.split(' — ')[0];

  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state));
      localStorage.setItem(TRAINING_STORE, JSON.stringify(training));
    } catch (error) {
      /* the export panel is the durable path */
    }
  }

  function decisionFor(card) {
    const bag = activeDecisions();
    if (!bag[card.cardId]) {
      bag[card.cardId] = {
        alternativeSupport: null,
        cardId: card.cardId,
        decidedAt: null,
        evidenceViewComplete: null,
        rationale: '',
        revealedBeforeVerdict: false,
        reviewerId: '',
        roleAssessments: {},
        verdict: null,
      };
    }
    return bag[card.cardId];
  }

  const bindable = (card) => card.argumentRoles.filter((role) => role.bindable);

  function assessment(decision, roleId) {
    if (!decision.roleAssessments[roleId]) {
      decision.roleAssessments[roleId] = { sentenceIds: [], status: null };
    }
    return decision.roleAssessments[roleId];
  }

  /** How many sentences a BOUND role needs, from the atom's own cardinality. */
  function cardinalityMet(cardinality, count) {
    if (cardinality === '1') return count === 1;
    if (cardinality === '>=2') return count >= 2;
    if (cardinality === '>=0') return true;
    return count >= 1;
  }

  /** Everything that keeps a card from counting. Shown, never guessed at. */
  function blockers(card) {
    const decision = decisionFor(card);
    const list = [];
    if (!decision.verdict) list.push('verdict');
    if (decision.alternativeSupport === null)
      list.push('contrôle « autre soutien »');
    if (decision.evidenceViewComplete === null)
      list.push('contrôle « vue complète »');
    for (const role of bindable(card)) {
      const entry = assessment(decision, role.roleId);
      if (entry.status === null) {
        list.push('statut du témoin ' + role.roleId);
        continue;
      }
      if (
        entry.status === 'BOUND' &&
        !cardinalityMet(role.cardinality, entry.sentenceIds.length)
      ) {
        list.push(
          'témoin ' +
            role.roleId +
            ' : ' +
            cardinalityWords(role.cardinality) +
            ' attendue(s)',
        );
      }
      // A role can be genuinely absent — that is often WHY a card is not
      // direct. Requiring a binding there would manufacture a false witness.
      // The one place absence is compatible with DIRECT is a not_exists
      // quantifier, where absence is exactly what the atom asserts.
      if (
        decision.verdict === 'DIRECT' &&
        entry.status !== 'BOUND' &&
        card.quantifier !== 'not_exists'
      ) {
        list.push('un DIRECT exige le témoin ' + role.roleId + ' lié');
      }
      if (
        decision.verdict === 'DIRECT' &&
        card.quantifier === 'not_exists' &&
        entry.status === 'BOUND'
      ) {
        list.push('un DIRECT sur not_exists exige ' + role.roleId + ' absent');
      }
    }
    if (decision.verdict === 'AMBIGUOUS' && !decision.rationale)
      list.push('justification');
    return list;
  }

  const complete = (card) => blockers(card).length === 0;

  const escapeHtml = (value) =>
    value.replace(
      /[&<>]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c],
    );

  function renderSignature(card) {
    const args = card.argumentRoles
      .map(
        (role) => '<span class="role">' + escapeHtml(role.roleId) + '</span>',
      )
      .join(', ');
    return escapeHtml(card.predicate) + '(' + args + ')';
  }

  function renderResponse(card) {
    const decision = decisionFor(card);
    // Every role a sentence is bound to, not just the last one. One label per
    // sentence hid half of a reviewer's own choice on the very first card.
    const bound = new Map();
    for (const [roleId, entry] of Object.entries(decision.roleAssessments)) {
      for (const id of entry.sentenceIds || []) {
        bound.set(id, [...(bound.get(id) || []), roleId]);
      }
    }
    const revealed = decision.revealed === true || !card.window;
    let html = '';
    let cursor = 0;
    for (const sentence of card.sentences) {
      if (sentence.start > cursor) {
        html += escapeHtml(card.response.slice(cursor, sentence.start));
      }
      const inWindow =
        !card.window ||
        (sentence.start < card.window.end && sentence.end > card.window.start);
      const classes = ['s'];
      if (card.candidateSentenceIds.includes(sentence.id)) classes.push('cand');
      if (bound.has(sentence.id)) classes.push('bound');
      if (!inWindow && !revealed) classes.push('hidden');
      const label = bound.has(sentence.id)
        ? ' [' + escapeHtml(bound.get(sentence.id).join(' + ')) + ']'
        : '';
      html +=
        '<span class="' +
        classes.join(' ') +
        '" data-s="' +
        sentence.id +
        '">' +
        escapeHtml(card.response.slice(sentence.start, sentence.end)) +
        label +
        '</span>';
      cursor = sentence.end;
    }
    if (cursor < card.response.length)
      html += escapeHtml(card.response.slice(cursor));
    return html;
  }

  function renderRail() {
    const rail = document.getElementById('rail');
    rail.innerHTML = '';
    activeCards().forEach((card, index) => {
      const button = document.createElement('button');
      const decision = activeDecisions()[card.cardId];
      if (decision && decision.verdict) {
        button.dataset.d = decision.verdict;
        button.dataset.incomplete = String(!complete(card));
      }
      if (index === getIndex()) button.dataset.current = 'true';
      button.title = 'carte ' + (index + 1);
      button.setAttribute('aria-label', 'carte ' + (index + 1));
      button.onclick = () => {
        setIndex(index);
        armedRole = null;
        render();
      };
      rail.appendChild(button);
    });
  }

  function tri(container, field) {
    const decision = decisionFor(activeCards()[getIndex()]);
    const value = decision[field];
    container.className = 'tri';
    container.innerHTML = '';
    for (const option of ['yes', 'no']) {
      const button = document.createElement('button');
      const words = {
        alternativeSupport: {
          no: 'non, aucune autre',
          yes: 'oui, une autre la prouve aussi',
        },
        evidenceViewComplete: {
          no: 'non, quelque chose m’a manqué',
          yes: 'oui, rien ne m’a manqué',
        },
      }[field];
      button.textContent = words[option];
      // Nothing is pressed while the answer is unset: no anchor, no proposal.
      button.setAttribute('aria-pressed', String(value === option));
      button.onclick = () => {
        decision[field] = option;
        touch();
      };
      container.appendChild(button);
    }
    if (value === null) {
      const tag = document.createElement('span');
      tag.className = 'chip';
      tag.textContent = 'sans réponse';
      container.appendChild(tag);
    }
  }

  function touch() {
    persist();
    render();
  }

  function render() {
    const card = activeCards()[getIndex()];
    const decision = decisionFor(card);
    const roleRows = card.argumentRoles
      .map((role) => {
        if (!role.bindable) {
          return (
            '<div class="role-card external-role"><div class="role-head"><button disabled data-role-static="' +
            escapeHtml(role.roleId) +
            '">' +
            escapeHtml(role.roleId) +
            '</button><span class="role-desc">' +
            escapeHtml(plainDescription(role)) +
            '</span></div><p class="role-line">Déjà fourni plus haut. Rien à faire.</p></div>'
          );
        }
        const entry = assessment(decision, role.roleId);
        const armed = armedRole === role.roleId;
        const labels = {
          ABSENT: 'il n’y en a pas dans la copie',
          AMBIGUOUS: 'je n’arrive pas à décider',
          BOUND: 'je peux la montrer',
        };
        const states = ['BOUND', 'ABSENT', 'AMBIGUOUS']
          .map(
            (status) =>
              '<button class="status" data-status="' +
              status +
              '" data-for="' +
              escapeHtml(role.roleId) +
              '" aria-pressed="' +
              String(entry.status === status) +
              '">' +
              labels[status] +
              '</button>',
          )
          .join('');
        let line = '';
        if (entry.status === 'BOUND') {
          line = entry.sentenceIds.length
            ? 'Phrases désignées : <span class="bound">' +
              entry.sentenceIds.join(', ') +
              '</span>' +
              (armed
                ? ' · clique une phrase dans la copie pour l’ajouter, reclique pour la retirer'
                : ' · <button class="link" data-role="' +
                  escapeHtml(role.roleId) +
                  '">modifier</button>')
            : '<span class="unbound">Clique maintenant la ou les phrases dans la copie, à droite.</span>';
        } else if (entry.status === null) {
          line =
            '<span class="unbound">Réponds à la question ci-dessus.</span>';
        }
        return (
          '<div class="role-card' +
          (armed ? ' armed' : '') +
          '"><div class="role-head"><button data-role="' +
          escapeHtml(role.roleId) +
          '" aria-pressed="' +
          String(armed) +
          '">' +
          escapeHtml(role.roleId) +
          '</button><span class="role-desc">' +
          escapeHtml(plainDescription(role)) +
          '</span><span class="role-card-n">' +
          cardinalityWords(role.cardinality) +
          '</span></div>' +
          '<p class="role-q">Où est-ce dans la copie ?</p>' +
          '<div class="role-states">' +
          states +
          '</div>' +
          (line ? '<p class="role-line">' + line + '</p>' : '') +
          '</div>'
        );
      })
      .join('');

    const feedback =
      inTraining() && complete(card) ? grade(card, decision) : null;
    const trainingBanner = inTraining()
      ? '<section class="training">' +
        '<div class="eyebrow">Échauffement · carte ' +
        (getIndex() + 1) +
        ' sur ' +
        TRAINING.length +
        '</div>' +
        '<p class="note" style="margin:6px 0 0">Ces huit cartes sont inventées. Réponds comme pour une vraie carte ; dès qu’elle est complète, la correction s’affiche ici. Rien de ce que tu fais ici n’est enregistré pour la vraie passe.</p>' +
        (feedback
          ? '<table class="grade">' +
            feedback.rows
              .map(
                (r) =>
                  '<tr class="' +
                  (r.ok ? 'ok' : 'ko') +
                  '"><th>' +
                  escapeHtml(r.field) +
                  '</th><td>' +
                  escapeHtml(r.yours) +
                  '</td><td>' +
                  escapeHtml(r.expected) +
                  '</td><td>' +
                  (r.ok ? '✓' : '✗') +
                  '</td></tr>',
              )
              .join('') +
            '</table><p class="lesson">' +
            escapeHtml(feedback.lesson) +
            '</p>' +
            (getIndex() + 1 < TRAINING.length
              ? '<p><button class="ghost" id="trainNext">carte d’entraînement suivante ▶</button></p>'
              : '<p><button class="ghost" id="trainDone">Échauffement terminé — commencer la vraie passe</button></p>')
          : '') +
        '</section>'
      : '';
    document.getElementById('app').innerHTML = `
      ${trainingBanner}
      <section class="guide">
        <div class="eyebrow">Comment traiter une carte</div>
        <ol>
          <li><strong>Ce qui était demandé</strong> : lis la consigne, et le dossier s’il est là.</li>
          <li><strong>La copie</strong> : lis-la d’un trait, pour comprendre ce que l’élève a choisi.</li>
          <li><strong>L’affirmation à vérifier</strong> : une phrase qui affirme quelque chose sur la copie. Ton travail : dire si elle est vraie. Le dernier mot de la formule fixe la sévérité.</li>
          <li><strong>La phrase examinée</strong> : relis-la seule, avec l’affirmation en tête.</li>
          <li><strong>Les témoins</strong> : pour chaque rôle, <strong>lié</strong> puis clique la phrase dans la copie, ou <strong>absent</strong>, ou <strong>ambigu</strong>.</li>
          <li><strong>Le verdict</strong> : la phrase examinée prouve-t-elle, à elle seule, que l’affirmation est vraie ? <strong>D</strong> oui, elle la prouve ; <strong>N</strong> non ; <strong>A</strong> impossible à dire.</li>
          <li><strong>Les deux contrôles</strong>, sans valeur par défaut : <strong>S</strong> ailleurs dans la copie, une autre phrase prouve-t-elle l’affirmation ? <strong>V</strong> avais-tu tout ce qu’il fallait pour juger ?</li>
        </ol>
        <dl>
          <dt>D · oui</dt><dd>La phrase prouve exactement l’affirmation, avec les témoins qu’elle nomme. Pas « on comprend que », pas « c’est à côté ».</dd>
          <dt>N · non</dt><dd>Elle ne prouve l’affirmation qu’à moitié, ou parle d’autre chose, ou le sous-entend sans le dire, ou s’appuie sur un mauvais témoin, ou le témoin manque. Une phrase vraie et bien écrite peut être un « non ».</dd>
          <dt>A · impossible à dire</dt><dd>Ce que tu as sous les yeux ne permet pas de trancher de façon fiable. Justification obligatoire.</dd>
          <dt>S · autre phrase</dt><dd>Après ton verdict, regarde le reste de la copie : une autre phrase prouve-t-elle l’affirmation à elle seule ? Si oui, la copie mérite le point même quand la phrase examinée ne le prouve pas ; ces cas sont analysés à part.</dd>
          <dt>V · manque</dt><dd>Avais-tu tout ce qu’il fallait ? « Non » veut dire que quelque chose t’a manqué (dossier non montré, extrait trop court) et que tu as jugé malgré ça. C’est une information utile, pas un aveu.</dd>
          <dt>J</dt><dd>Aller à la justification. Échap pour en sortir.</dd>
          <dt>← →</dt><dd>Carte précédente, carte suivante. La barre du haut est cliquable.</dd>
        </dl>
        <p class="note" style="margin:12px 0 0">Tu ne sais jamais d’où vient une carte, c’est voulu. Ne cherche pas à le deviner, ne te fie ni à la longueur ni au style : lis la phrase et demande-toi si elle prouve l’affirmation.</p>
      </section>
      <div>
        <section class="panel">
          <div class="eyebrow">1 · Ce qui était demandé</div>
          ${card.frame ? `<p class="context"><strong>Consigne.</strong> ${escapeHtml(card.frame)}</p>` : ''}
          ${card.dossier ? `<p class="context"><strong>Dossier.</strong> ${escapeHtml(card.dossier)}</p>` : ''}
          ${!card.frame && !card.dossier ? '<p class="context">Sur cette famille de cartes, ni la consigne ni le dossier ne sont montrés : la case se juge sur la copie seule.</p>' : ''}
          ${hint('Le sujet donné à l’élève, et les faits qu’on lui a fournis. Tu n’y réponds pas : c’est le contexte qui donne leur sens à « pertinent », « adapté », « répond à ».')}
        </section>
        <section class="panel">
          <div class="eyebrow">3 · L’affirmation à vérifier</div>
          <p class="atom">${escapeHtml(card.atom)}</p>
          ${hint('Une affirmation sur la copie, tirée du barème et découpée assez fin pour qu’on puisse dire vrai ou faux. Ton travail sur cette carte : dire si la phrase examinée la prouve. Tout ce que tu décides ici parle de cette affirmation et d’elle seule.')}
          <p class="sig">${renderSignature(card)} · ${escapeHtml(card.quantifier)}${card.logicalOperator === 'none' ? '' : ' · ' + escapeHtml(card.logicalOperator)}</p>
          ${hint('La même question écrite en formule, pour qu’il n’y ait pas d’interprétation : la relation, puis entre parenthèses les rôles qu’elle relie. ' + quantifierHint(card.quantifier))}
          <p class="note" style="margin-bottom:0">Phrase du barème&nbsp;: «&nbsp;${escapeHtml(card.sourcePhrase)}&nbsp;» — critère ${escapeHtml(card.criterionLabel)}</p>
          ${hint('D’où vient l’affirmation : le mot du barème qu’on a transformé en phrase vérifiable, et le critère qui le contient.')}
        </section>
        <section class="panel">
          <div class="eyebrow">4 · La phrase examinée</div>
          <blockquote class="candidate">${escapeHtml(card.candidateSpan)}</blockquote>
          ${hint('La phrase surlignée dans la copie, reprise seule. Ta réponse oui / non / impossible à dire parle d’elle, à elle seule : prouve-t-elle l’affirmation ?')}
        </section>
        <section class="panel">
          <div class="eyebrow">5 · Les témoins</div>
          ${hint('Pour chaque témoin, dis où il se trouve dans la copie. Si tu peux le montrer, clique la ou les phrases à droite. S’il n’y en a pas, dis-le : c’est une réponse normale, et souvent la raison d’un « non ».')}
          <div class="roles" style="border-top:0;margin-top:0;padding-top:0">
            ${roleRows}
          </div>
        </section>
      </div>
      <div class="sticky">
        <section class="panel">
          <div class="eyebrow">
            2 · ${card.window && decision.revealed !== true ? 'La copie, extrait autour de la phrase' : 'La copie de l’élève'}
            <span class="chip">${escapeHtml(card.stratum)}</span>
            <span class="chip">${escapeHtml(card.cardId)}</span>
          </div>
          ${hint('Lis-la d’un trait. Les phrases sont numérotées à partir de s0 (la première). Elles deviennent cliquables quand un rôle est sur « lié » : cliquer une phrase l’attribue à ce rôle, recliquer la détache. Le surlignage doré est la phrase examinée.' + (card.window && decision.revealed !== true ? ' Tu ne vois qu’un extrait : ouvrir la copie entière est permis, et simplement noté.' : ''))}
          <div class="response" id="resp">${renderResponse(card)}</div>
          ${card.window && decision.revealed !== true ? '<p style="margin:12px 0 0"><button class="ghost" id="reveal">révéler la copie entière</button> <span class="note">l’ouverture est notée</span></p>' : ''}
        </section>
      </div>`;

    for (const button of document.querySelectorAll('#verdicts button')) {
      button.setAttribute(
        'aria-pressed',
        String(button.dataset.v === decision.verdict),
      );
    }
    // The verdict question restates the affirmation, so the word that decides
    // it — fidèle, pertinent, explicite — is under the reviewer's eyes at the
    // moment of deciding. A justification about another word answers another
    // card.
    document.getElementById('verdictQuestion').innerHTML =
      '6 · La phrase examinée prouve-t-elle que&nbsp;: <em>«&nbsp;' +
      escapeHtml(card.atom) +
      '&nbsp;»</em>&nbsp;?';
    tri(document.getElementById('altTri'), 'alternativeSupport');
    tri(document.getElementById('viewTri'), 'evidenceViewComplete');
    document.getElementById('why').value = decision.rationale || '';
    const missing = blockers(card);
    const todo = document.getElementById('todo');
    todo.className = 'todo' + (missing.length ? '' : ' ok');
    todo.textContent = missing.length
      ? 'manque : ' + missing.join(', ')
      : 'carte complète';
    document.getElementById('dock').hidden = false;

    const done = activeCards().filter(
      (c) => activeDecisions()[c.cardId] && complete(c),
    ).length;
    document.getElementById('progress').textContent =
      `${inTraining() ? 'entraînement ' : 'carte '}${getIndex() + 1} / ${activeCards().length} · ${done} complètes`;
    document.getElementById('who').textContent = state.reviewer || 'relecteur…';

    for (const button of document.querySelectorAll(
      '.role-card button.status',
    )) {
      button.onclick = () => {
        const entry = assessment(decision, button.dataset.for);
        entry.status =
          entry.status === button.dataset.status ? null : button.dataset.status;
        if (entry.status !== 'BOUND') entry.sentenceIds = [];
        if (entry.status === 'BOUND') armedRole = button.dataset.for;
        touch();
      };
    }
    for (const button of document.querySelectorAll(
      '.role-card button[data-role]',
    )) {
      button.onclick = () => {
        armedRole =
          armedRole === button.dataset.role ? null : button.dataset.role;
        render();
      };
    }
    for (const sentence of document.querySelectorAll('#resp .s')) {
      sentence.onclick = () => {
        if (!armedRole) return;
        const entry = assessment(decision, armedRole);
        const id = sentence.dataset.s;
        entry.sentenceIds = entry.sentenceIds.includes(id)
          ? entry.sentenceIds.filter((x) => x !== id)
          : [...entry.sentenceIds, id];
        entry.status = entry.sentenceIds.length ? 'BOUND' : null;
        touch();
      };
    }
    const reveal = document.getElementById('reveal');
    if (reveal) {
      reveal.onclick = () => {
        decision.revealed = true;
        if (!decision.verdict) decision.revealedBeforeVerdict = true;
        touch();
      };
    }
    const trainNext = document.getElementById('trainNext');
    if (trainNext) trainNext.onclick = () => advance(1);
    const trainDone = document.getElementById('trainDone');
    if (trainDone) {
      trainDone.onclick = () => {
        training.done = true;
        state.index = 0;
        armedRole = null;
        persist();
        render();
      };
    }
    renderRail();
  }

  function record(verdict) {
    const card = activeCards()[getIndex()];
    const decision = decisionFor(card);
    decision.verdict = verdict;
    decision.decidedAt = new Date().toISOString();
    decision.reviewerId = state.reviewer;
    persist();
    render();
    if (complete(card) && !inTraining()) advance(1);
  }

  function advance(step) {
    setIndex(
      Math.min(activeCards().length - 1, Math.max(0, getIndex() + step)),
    );
    armedRole = null;
    persist();
    render();
  }

  for (const button of document.querySelectorAll('#verdicts button')) {
    button.onclick = () => record(button.dataset.v);
  }
  document.getElementById('help').onclick = toggleHelp;
  document.getElementById('train').onclick = () => {
    if (
      inTraining() ||
      confirm(
        'Refaire l’échauffement ? Tes décisions de la vraie passe sont conservées.',
      )
    ) {
      training.done = false;
      training.decisions = {};
      training.index = 0;
      armedRole = null;
      persist();
      render();
    }
  };
  document.getElementById('prev').onclick = () => advance(-1);
  document.getElementById('next').onclick = () => advance(1);
  document.getElementById('why').oninput = () => {
    decisionFor(activeCards()[getIndex()]).rationale = document
      .getElementById('why')
      .value.trim();
    persist();
    const missing = blockers(activeCards()[getIndex()]);
    const todo = document.getElementById('todo');
    todo.className = 'todo' + (missing.length ? '' : ' ok');
    todo.textContent = missing.length
      ? 'manque : ' + missing.join(', ')
      : 'carte complète';
  };
  document.getElementById('who').onclick = () => {
    const value = prompt(
      'Identifiant du relecteur (enregistré avec chaque décision)',
      state.reviewer,
    );
    if (value !== null) {
      state.reviewer = value.trim();
      touch();
    }
  };

  const cycle = (field) => {
    const decision = decisionFor(activeCards()[getIndex()]);
    const order = [null, 'yes', 'no'];
    decision[field] =
      order[(order.indexOf(decision[field]) + 1) % order.length];
    touch();
  };

  // One keyboard handler, whatever happens. Running this script twice on the
  // same window (a hot reload, a test harness) must replace the previous
  // handler, not stack a second one that toggles everything twice.
  if (window.__adjudicationKeydown) {
    removeEventListener('keydown', window.__adjudicationKeydown);
  }
  window.__adjudicationKeydown = (event) => {
    const target = event.target;
    if (target instanceof Element && target.matches('input, textarea')) {
      if (event.key === 'Escape' && target instanceof HTMLElement)
        target.blur();
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 'd') record('DIRECT');
    else if (key === 'n') record('NOT_DIRECT');
    else if (key === 'a') record('AMBIGUOUS');
    else if (key === 's') cycle('alternativeSupport');
    else if (key === 'v') cycle('evidenceViewComplete');
    else if (event.key === '?') toggleHelp();
    else if (key === 'j') {
      event.preventDefault();
      document.getElementById('why').focus();
    } else if (event.key === 'ArrowLeft') advance(-1);
    else if (event.key === 'ArrowRight') advance(1);
  };
  addEventListener('keydown', window.__adjudicationKeydown);

  /** Canonical JSON: sorted keys, compact separators — the repo's recipe. */
  function canonical(value) {
    if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
    if (value && typeof value === 'object') {
      return (
        '{' +
        Object.keys(value)
          .sort()
          .map((k) => JSON.stringify(k) + ':' + canonical(value[k]))
          .join(',') +
        '}'
      );
    }
    return JSON.stringify(value);
  }

  document.getElementById('toExport').onclick = async () => {
    if (inTraining()) {
      document.getElementById('dock').hidden = true;
      document.getElementById('app').innerHTML =
        '<div style="grid-column: 1 / -1"><section class="panel"><div class="eyebrow">Export indisponible</div><p class="note">L’échauffement n’est pas terminé. L’export ne concerne que la vraie passe.</p><p><button class="ghost" id="back">retour</button></p></section></div>';
      document.getElementById('back').onclick = () => {
        document.getElementById('dock').hidden = false;
        render();
      };
      return;
    }
    const refusals = [];
    if (!state.reviewer) refusals.push('aucun identifiant de relecteur');
    const incomplete = CARDS.filter((card) => !complete(card));
    if (incomplete.length) {
      refusals.push(
        incomplete.length + ' cartes incomplètes sur ' + CARDS.length,
      );
    }
    document.getElementById('dock').hidden = true;

    if (refusals.length) {
      const detail = incomplete
        .slice(0, 12)
        .map(
          (card) =>
            '<li>' +
            escapeHtml(card.cardId) +
            ' — ' +
            escapeHtml(blockers(card).join(', ')) +
            '</li>',
        )
        .join('');
      document.getElementById('app').innerHTML = `
        <div style="grid-column: 1 / -1"><section class="panel">
          <div class="eyebrow">Export refusé</div>
          <p class="note">Une adjudication partielle exportée devient une adjudication citée.
             La passe 1 ne s’exporte que complète.</p>
          <ul class="blockers">${refusals.map((r) => '<li>' + escapeHtml(r) + '</li>').join('')}</ul>
          ${detail ? '<div class="eyebrow" style="margin-top:14px">Premières cartes en cause</div><ul class="blockers">' + detail + '</ul>' : ''}
          <p><button class="ghost" id="back">retour aux cartes</button></p>
        </section></div>`;
      document.getElementById('back').onclick = () => {
        document.getElementById('dock').hidden = false;
        render();
      };
      return;
    }

    const payload = {
      atomTaxonomyHash: DECK.atomTaxonomyHash,
      decisions: CARDS.map((card) => {
        const d = state.decisions[card.cardId];
        return {
          alternativeSupport: d.alternativeSupport,
          cardId: d.cardId,
          decidedAt: d.decidedAt,
          evidenceViewComplete: d.evidenceViewComplete,
          rationale: d.rationale,
          revealedBeforeVerdict: d.revealedBeforeVerdict === true,
          reviewerId: d.reviewerId || state.reviewer,
          roleAssessments: d.roleAssessments,
          verdict: d.verdict,
        };
      }).sort((a, b) => a.cardId.localeCompare(b.cardId)),
      deckHash: DECK.contentHash,
      deckSeed: DECK.shuffleSeed,
      manifestHash: DECK.manifestHash,
      pass: 1,
      schemaVersion: 3,
    };
    const text = canonical(payload);
    let digest = 'indisponible hors https';
    if (globalThis.crypto && crypto.subtle) {
      const bytes = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(text),
      );
      digest =
        'sha256:' +
        [...new Uint8Array(bytes)]
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
    }
    document.getElementById('app').innerHTML = `
      <div style="grid-column: 1 / -1"><section class="panel">
        <div class="eyebrow">Export de la passe 1</div>
        <p class="note">${payload.decisions.length} décisions complètes. Enregistre ce texte tel quel dans
          <code>benchmarks/ai-correction/regression/adjudication-pass1.v1.json</code>.
          Toute modification ultérieure produit une nouvelle version, jamais une réécriture.</p>
        <p class="hash"><strong>empreinte du texte ci-dessous&nbsp;:</strong> ${digest}</p>
        <p><button class="ghost" id="copy">copier</button>
           <button class="ghost" id="back">retour aux cartes</button></p>
        <textarea readonly id="out">${escapeHtml(text)}</textarea>
      </section></div>`;
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('copy').textContent = 'copié';
      } catch (error) {
        document.getElementById('out').select();
        document.getElementById('copy').textContent = 'sélectionné — ⌘C';
      }
    };
    document.getElementById('back').onclick = () => {
      document.getElementById('dock').hidden = false;
      render();
    };
  };

  render();
</script>
